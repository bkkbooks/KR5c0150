front:
  text: 太上説玄天大聖真武本傳神呪妙經卷之一
  hash: sha256:417943f0aea210a63b1419253c0d2bcfc71e503a754f33be3f3f1b9c542684f2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0150_HFL_001-001a, image: hfl/0530/0530-004.png}
body:
  text: 鄽人方田子佩升玄內教籙陳伀集疏太上太者尊也上者高也乃太古造道之祖是玉清聖境無上法王元始上帝上清真境三界醫王靈寶上帝太清仙境十方導師混元上帝天地人之祖氣本三清上帝出淮南子曰太上之道生萬物而不有成萬象而不宰又曰太上養化其次正法是故此世歷代人主追尊三清並號太上之稱也説者釋也乃太上演説諸部經法皆引進妙門之漸老子曰太上立德其次立功按此經乃出北極宫紫微令紫微大帝準太上立功之敕命因乘兹而所説耶緣龍漢四劫元年應大羅三天永壽元年元始上帝於上元之曰聖命駕御太霄八景始青天中敷演至道靈寶度人之法欲將導三十六天上帝及諸真宰忽然天門震闢乃見是下土時當開皇三劫運終之變惡氣衝突按董真君實録下世帝紂淫心失道矯侮上天遂感六天魔王傷害九地黎庶之故也元始乃命昊天太上開天執符御曆舍真體道金闕玉皇大天帝製詔降于北極省施行陽助周武伐紂平治社稷陰遣太玄大將降魔間分人鬼應七日中兩皆克平則宇宙清肅矣玄天玄者一也天者霄也乃北方一景紫霄太玄天泛天一之氣化今玄帝位居之因昔在下土黃帝五十七年天詔飛升府署駐在此境也開化水所乃九霄之首矣虛一之氣化西南景霄始素天曰二景純一之氣化東方青霄青元天曰三景靈一之氣化東南碧霄始分天曰四景虛梵之氣化五景神霄昊極天玉帝闕至一之氣化西北琅霄始玄天曰六景玄一之氣化西方玉霄太素天曰七景太一之氣化東北太霄始青天曰八景下覆南閻洞浮乃元始駕此救度羣黎之處元梵之氣化南方絳霄太丹天曰九景是故九霄之內分置五劫之年以記天元也大羅三天守建立年號也玄帝十五歲時感遇紫元君曰子契太和必當升舉矣大聖大者化也聖者生也玄帝師告之升舉日後上為三境輔臣下作十方大聖也在二千五百歲之後果黃帝庚寅歲飛升按提綱論歷代帝系年譜至商紂二十三年己巳歲恰二千五百載按通鑑乃文王受命之年武王元年己卯遇紫元君授記之數一十年矣天攝坎離二精玄武也世滅無道商紂乃周武也真武真者正也武者神也本號玄武避宋朝廟諱改賜曰真武況臨討果行不殺之嚴也玉帝遣鎮北方及至降紂世六魔之日敕慰披髮跣足賜建皂纛玄旗躬披鎧甲功成而攝踏龜蛇回天而天稱元帥世號福神玄帝是日仰上嘆曰今果符師語董真君實録載云又於大宋仁宗朝嘉祐二年丁酉歲上應大羅天真化三年也至其五月五日三清上帝並升玉宸殿敕九天司馬開曆考萬天功過校正三官四聖自太虛開化神一挺生有保天佑地化育羣生四年正月初一日鑽玉華院撰制玉册訖宣詔三官四聖於上元節日並赴七寶瓊臺當亞帝真時昊天玉尊親行典儀册封至玄武加號太上紫皇天一真人玉虛師相玄天上帝領九天採訪使職及下蔭龜蛇號本傳本者源也傳者流也乃金闕日曆院編修史文也況歷代帝主各有典禮徽宗詔製褒其威助感應事也其上天採訪真司一一摘之謄言奏達玄都補入金格玉曆凡遇上命考績則金闕侍中司馬大神韓君丈人及司命可韓真人司録定名真君司功九天採訪真君司過九天儲福真君並具實保舉續成一家之書謂之曰本傳矣今者又自天降玄帝實録一本下凡因襄陽紫虛壇班長張明道出示蔣人玉虒刊印于世矣仰知玄帝聖神之事固未易知哉所編撰者乃太真西王左上卿上清天機都承旨神應元惠真君飛霞靈光真人中黃先生臣董素皇所編集成上元九天掌籍玉堂學士充下元水府轉運使兼九地提點刑獄公事上仙元皇君張亞為之敘焉末紀曰時在上天延康七劫無上大羅天開化十三年下世大宋孝宗淳熙十一年係中上元甲子內歲次甲辰正月辛卯朔十五日乙巳二真續批降曰凡觀之士當洗心跪誦之矣神呪神者明也呪者誓也上帝立此取會大信合同之約語按伏魔經曰飛揚隱語也乃是大道橐籥之籲神之聽之一聞扣真召靈罔不來格宜惟交乾布斗或激坤指罡上佐天關於壇心叩齒祝香隨意告盟至心持誦志感大聖玄帝靈通經緯恍惚萬方不疾而速不行而至其諸善應獲大吉祥承此之制命耶妙經妙者達也經者徑也玄帝本事呪曰天得以健地得以寧民得以養是故三才萬物皆賴大道一元之氣而運轉洪鈞矣爾時妙行有為衆之誠大帝發光明干道談養一之法開蒙泰之機指日用之時皆玄帝歷行之術也故道在天而混成元氣在地而潛統元形浹人之志意元識達元識者了此經中玄奧而能行之也本經云玄帝降日其於福利保人慶壽以全天命其有氣正心純忠全孝盡名書玉簡保舉升仙宜在酌水豐香露情慤實本經曰稽首禱告無願不從是時謫仙張天師三遇太上降化按南斗經授以經籍千軸皆修行之要道將傳付有道者令生身受度使永劫長存然此經亦在千軸數內矣咦此書載道見玄天大開方便之門道在人行躋太上域引登仙之徑老子曰合抱之木生於毫末九層之臺起于纍土千里之行始于足下又曰愼終如始則無敗事孟子曰夫道若大路然豈難知哉人病不求耳爾時爾時者謂如是聞也撰如是之實者出自昊天編修院司經真官裁撰寶章金格事故用爾時二字興發潤色編繕機隱啓辭首義也紫微大帝佐金闕門下紫微令事執天地水三府大政總判羣命主御生殺之權階曰上元一品九氣賜福天官北極紫微大帝於龍漢元年中元之日上天開化建五劫紹運曰龍漢曰赤明曰上皇曰延康曰開皇五劫既周復從其始于時正當龍漢四劫元年係無上大羅天永壽元年應下土己卯歲周武王元年七月壬申十五日乃天府節會校理之辰在太清境上北極宫中中天北極宫紫微令署額也隸金闕太清境制御萬靈公事所向紫微之殿前是殿號乃金闕北極省堂之名也而左右分司無不統攝為三光運化之庭法陰陽開閉之所天文志曰紫微垣一十五星西蕃七星東蕃八星在北斗北一曰紫微大帝之座也洎諸天官星宿且昭昭然則下土皆可睹焉列諸天之上聖大抵紫微垣內中外品官各有司主計一百一十八名積數七百八十二星皆理璿璣之政為三界最要之有司者乃南北二斗東西兩曹五方五星六宫六曜二十八宿十二宫神此六班猶六部尚書之佐飛天神王秉監察御史督內外臺職無極仙衆承機察八紘邊境之差諸僚曹等準制於三元日咸遵北極紫微令事校録結籍南北二斗南斗秉爵秩祿俸之籍北斗宰生死是非之簿也按南斗經曰南斗六司與北斗七政分職共理三才六合八卦九宫總轄中外百辟官品乃紫微大微兩極都曹也上係十二分次天真靈神下統十二分野地祇主者四瀆五嶽九州八紘名山大川城隍社廟中及人民羣類萬物無不計係其簿籍掌握南斗六司真君尊號天府司命上相鎮國真君天相司録上相鎮嶽真君天梁延壽保命真君天同益算保生真君天樞度厄文昌鍊魂真君天機上生監簿大理真君北斗七政星君尊號天璿貪狼太星君地璣巨門元星君機人祿存真星君權時文曲紐星君玉衡廉貞綱星君闓陽武曲紀星君瑶光破軍關星君每月於三七日二斗星君各遣星光童子案下人間校戒生死罪福事也東西兩曹東斗注算司會玉靈瑶篇考績世人德業治性善狀西斗記名校勘羣生受度滅絶關歷大計之令東斗經曰東斗帝君之命主算延年復流下世能度三塗五苦八難之厄能與削死上生西斗經曰玄元上清大成帝君主天之柄威獄號令降魔制神典司內外伐戮之事搜察容隱邪僻之形下記世人有善必録有惡必記名號散殊生死之限常有八百萬億輪轉周回善惡根本如纏如索昭然不隱東斗五星尊號蒼靈延生真君靈光護命真君開天大衛集福真君大明和陽保和真君尾極總監真君西斗四星尊號白標帝君高元真君曲皇靈真君將巨威真君夫兩曹真司下降人間定制於月之一日五九日東斗降七九十五日西斗降洎五方之五星司庚辛甲乙壬癸丙丁戊己之五方乃金木水火土五常形氣之星七星神呪經曰天地設位乃建五行巡歷天下察無道之國觀不祥之人凡處墟域之內蠢動含生命係于天混元經纂要東方歲星主仁生甲乙化草木司春令宰蠕蛸飛動千種化生之蟲凡十二歲緯一周天西方太白主義生庚辛化金石司秋令宰帶角無角千種胎生之獸凡歷一歲緯一周天南方熒惑主禮生丙丁化煙火司夏令宰匾毛羽翼千種卵生之禽凡二歲緯一周天北方辰星主智生壬癸化水泉司冬令宰帶甲無鱗千種濕生之族凡歷一歲緯一周天中央鎮星主信生戊己化塵土司四季宰聖賢愚癡千種裸靈之人凡二十九歲緯一周天若國主能肅溫又良哲恭清儉聖讓者皇極建也則自然五星降祥澤被有國天下洪範要曰貌恭肅歲星應順木曲直降時雨言從又太白應順金從革降時暘視明哲熒惑應順火炎上降時燠聽聰謀辰星應順水潤下降時寒思睿聖鎮星應順土稼穡降時風斯乃人君德契五福均延于兆庶矣如其反是則星辰凌犯彗孛衝破遂生刀兵水旱流離凶虋以致死亡兆庶也命書曰五星躔天次有順留逆伏之段名臨照男女當生四柱順吉逆凶也及六宫之六曜司太陽太陰天一太一黃幡豹尾之六宫主晝夜晦明風雨之六運乃日曜月曜木曜水曜火曜土曜六曜右行天次並準紫微格制運躔遲速也消災經曰欲界衆生惟務苟貪不修正道不知有五行推運十一曜照臨主其災福至如火土留伏金木凌犯羅計勃逆日月薄蝕以致州縣播遷人民災難水火蟲蝗刀兵相犯悉皆由也天文志曰國無政不善用則自取日月謫見于天垂六極之變者警懼懲戒人君者也日帝衆陽宗配人君司生育一歲一周天如蝕警人主政不臧皇不振神志眊罔社稷厥極弱其見日蝕罰常陰月皇衆陰宗配后妃及大臣司刑罰蝕懲姦佞臣子一月一周天言不從膽張僣輕百姓厥極憂則見月蝕罰常陽紫氣續木曜配五福司學業二十八年緯一周天主人威儀貌不恭意狂俊奪農時厥極惡木帶冰氛罰常雨月孛續水曜配宗廟司祀享九歲一周天怒見毛頭彗尾聽不聰情縱急逆天時厥極貧水禍肹蠁罰常寒羅㬋續火曜配勛業司陽德一十八年一周天怒蝕其日月視不眀心逆舒棄法律厥極疾火擲血流罰常燠計都續土曜配稼穡司陰德一十八年一周天怒則崩摧山川思不睿慮妄蒙侮父母厥極凶飢饉流荒罰常風夫太平之世日不蝕星不悖蓋德之至矣應世間男女皆以太陽起命宫也太陰到處為身宫也天一司人五福太一掌人夭橫羅㬋懲男計都戒女於是六曜之內曰月明分晝夜也羅計孛紫並暗曜化人遷善每罰凶人則光現二十八宿音秀居四方列周天為三百六十五度餘隸七政日月水火木金土所躔之舍曰二十八宿以正歲月昏旦立四方經七虛昴星房副日帝政危畢張心副月皇政壁參箕軫副辰星政室嘴翼尾副熒惑政斗奎并角副歲星政牛婁鬼亢副太白政女胃柳氐副鎮星政又常循治年月日時而成歲功也降浹六十甲子男女曰胎星凡按節氣分真下理二十四治幽獄公事按天文志宰天子儲君后妃宗廟文武官寮制度及天下萬物之像並付斗木文昌星君司爵祿冬至曰紏真多治牛金大武星君司犧牲小寒日紏昌利治女土天須星君司剪裁大寒日紏鹿堂治虛日天任星君司填墓立春日紏湧泉治危月天一星君司五穀雨水日紏北平治室火天社星君司營室紏督軍糧廪府事壁水藴德星君司圖書驚蟄日紏稠梗治奎木貪豕星君司禁暴春分日紏主簿治婁金義武星君司祭