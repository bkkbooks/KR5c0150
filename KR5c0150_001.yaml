軍樂石陽庚子將軍楊仲升壬子將軍宿上卿乙丑將軍龍季卿丁丑將軍趙子玉己丑將軍範仲陽辛丑將軍林衛卿癸丑將軍江漢卿甲寅將軍明文章丙寅將軍張仲卿戊寅將軍虞子張庚寅將軍褚進卿壬寅將軍丘孟卿乙卯將軍戴公陽丁卯將軍司馬卿己卯將軍石文陽辛卯將軍郭子良癸卯將軍蘇他家甲辰將軍孟非卿丙辰將軍霍叔英戊辰將軍楚季卿庚辰將軍尹佳卿壬辰將軍武雉卿乙巳將軍唐文卿丁巳將軍崔巨卿己巳將軍何文昌辛巳將軍楊仲公癸巳將軍史公宋甲午將軍衛上卿丙午將軍魏文公戊午將軍從元光庚午將軍馮仲卿壬午將軍馬子明乙未將軍社仲陽丁未將軍石叔通已未將軍時通卿辛未將軍王文章癸未將軍吕威明甲申將軍扈文長丙申將軍朱伯衆戊申將軍範伯陽庚申將軍華文陽壬申將軍侯博卿乙酉將軍孔利公丁酉將軍臧文公己酉將軍成文長辛酉將軍邴元玉癸酉將軍孫仲房甲戌將軍江子展丙戌將軍車元升戊戌將軍範少卿庚戌將軍史子仁壬戌將軍樂進卿乙亥將軍龐明心丁亥將軍張文通己亥將軍鄧都卿辛亥將軍左子行癸亥將軍左石松衆帥等每上赴中臺校遷日則先關申九天遊奕使司然後俱離人寰玄帝統元和遷校府司案下人間浹扶化育也庚申此日屬太玄上宫制民三尸道言凡胎之軀才得成形便有百骸表裏之神伺察人為百事唯三尸神領衆輒言夫太玄號者乃北極都畿境號也上宫者乃紫微上元宫名也按生神品經載太上曰吾以道氣運化取象乾坤陰陽兩半假合成人變化神識各立司存名位曰腦神曰泥丸頂中神通天頂前神朱陽頂後神玄冥頂左神青光頂右神白章髮神曰蒼華額神曰天庭左眉神翠童右眉神羽童左目神日光右目神月光左顴神玉關右顴神玉梁鼻左竅通陽鼻右竅通陰口左神命童口右神天糧齒神曰命關左牙神天鍾右牙神天磬舌神曰赤童上唇神停蓋下唇神靜輿左頤神黃父右頤神黃母頸左神柱人頸右神升平左肩神遠山右肩神遠安左肘神飛龍右肘神伏虎左手神天丁右手神天鄒左指神甲卒右指神禦凶腋左神扶干腋右神扶刀左肋神衛邊右肋神防非胸神曰天田背神曰紫房脊神曰運陽腹神曰包靈臍神曰中平脾神曰黃常心神曰丹元肝神曰無英肺神曰白元腎神曰桃康腰左神動關腰右神搖停陰神曰幽關尻神曰幽闕左股神玄嶽右股神玄山左膝神轉生右膝神幽停左脛神天柱右脛神天關左腂神幽狐右腂神幽狼左腳神輪空右腳神運虛骨神曰內丁肉神曰衛非皮神曰包羅按道喻云已上身神謂之百魔中黃經曰一者上尸彭琚居腦中二者中尸彭質居明堂三者下尸彭嶠居腹胃俱各長七寸結氣成神如赤子狀榮衛流通運化自然與天地合每到庚申日出入人身上詣太玄三府署中三十六曹下合屬案內言善輟惡也玄帝統太玄元帥職司案降下土彈鎮百魔公事無令妄自出入人身也一月一辰降於下界且三元八節甲子庚申及三六日則輔助造道也又復成年定制一十二次秉三界大都督威柄準一月一辰樹纛案行天下操扶社稷普福乾坤矣其諸降日分在本經後十洞巡遊之句下於是玄帝真遊功德則溥海內外顯應昭然承恩者庶廣稱揚者頗衆皆形于方册今謫宜為之注録善罰惡凡人之善惡因起自身口意三業之感召敦不至滿稔之報蓋玄帝真司常警以賞罰事啓聖記云宋朝祥符初福州興化軍一商人程嗣昌素好恬惔因遊密州駐交橋鎮睹獵輩酷捕飛禽物命枉殺不忍觀聞念將家藏戒殺圖文印施命工鏤板畢遇十一月初七真武降日遂焚香叩拜靈空告云此地飛禽無辜致死願惟聖佑圖文化民從善及施日稅攔頭彭景首請一本張貼于壁不期妻華三娘才聞所誦發怒碎扯棄穢中即買一枚黑鯉竟操刀劊之其魚躍尾刺損阿華一目迸血被地苦吟萬狀血乃化蟲醫巫莫療景覓嗣昌詬罵才脫潛抵遺頌坐逝矣無何鎮寨廳前見程太足懸空立巡檢宣旦知異乃炷香問程太遽對言曰吾是中天真武也察知此地居民纍劫酷捕物命恣充口腹業障深重尚未彰報先顯阿華毁程嗣昌勸文罪當處惡死報豈容逃餘民犯别聽言乾不見時虞部員外郎向郭提點山澤公事過彼聞風訝審宣旦示程嗣昌親筆頌文曰我不傷殘命皇天賜善名諸人還未信報應甚分明洎讀畢懇而懷歸回朝敷奏真宗皇帝嘉賜讚諡真武靈驗事仰謄白附禮典照應御制曰三元一神通應十門煒燁光祥咸真滅殞故仰知玄帝録一程嗣昌者勸百善罰一華嚚婦者懲百惡感應篇曰其有曾行惡事後自改悔諸惡莫作衆善奉行久久必獲吉慶謂轉禍成福者也輔正除邪君上尊為萬姓之表表正則天下何物不正政在克忠輔臣俾民咸遂其性故帝歷陰相社稷之權每分真寄凡以輔正有國僣禍妖淫豈能久害邦國哉啓聖記云唐高宗崩於柩前立皇太子豫王登極時武后擅政放帝居房州后即擢母弟之子賀全龍充管內提點除殿前觀察使惟習妖術是務詐號曰北極七元助國正法也后每奇之全龍恃寵擅權讒黜百僚忽聞泰川路告急奏今西鄙諸耶王趙宏統妖兵入境助戰威武者乃蛇虎煙火百端精怪今本司用兵不前羣臣議奏賀全龍行本身七元法往剋武后依敕下樞密崔察授符給兵三千領抵寇鋒大軍亡半家童折三全龍無措邊郡轉危求收朝臣再議保奏黃門侍郎裴濤一未仕子仲芳年登十六貌異材神必能決勝趙宏妖寇后宣見賜光祿大夫官兵五百敕免朝辭歸拜父母佩劍提兵直抵寇陳乃揮劍折衝其趙宏倒戈墮馬兵僵妖潰盡擒回朝趨見武后賜登殿坐敕撫曰朕知卿天神人耶光祿始奏賀全龍事狐女元綱妖術有玷國風后尚保愛全龍宣令携家童數百入內當殿比試七元法全龍至叩牙噀水以成雲霧童子皆騰空際放蕩狂風驟霰雨雹光祿揮劍招之一一墮搐入劍鞘內舉真火呪焚滅於是羣臣稱賀太平放大赦遍布天下時通天元年九月竟改號神功元年也光祿既聞告别父母曰兒自天來今從北去言訖退揖坐逝不覺尸騰雲際仙樂嘹喨冉冉投北方而去事奏聖聽追封爵號神應將軍濤奏納官請宅為觀武后依贈濤號神應慶清居士就名觀額唐祚復興也乃玄帝警示後世人臣無設姦雄之佞犯者無不擯絶且人懷正念必至真玄邪念未成立遭惡趣濟拔天人水火木金土穀六物因地生而天成人得養生送死故君為民之天食乃命之天民賴君安君以民立尚有凶年歉歲造化然耳唯有德君上能解劫變災凶回為休祥資接兆民按啓聖記宋太祖在周顯德元年行營征瀛州路逢一羽士密告貴極兆云總得真武陰助言訖化光去太祖信誠章醮露答畢而果承周襌國號曰宋改元建隆遍賞天下軍旅惟瀛州闕乏陳疇奏請表至述庫積蕃商寄錢五萬貫欲借充邊戍犒賞回旨依給付高陽關鄭度支遣訖續據蕃商伊壽先等到司陳疇齎周朝通關文牒述寄庫錢事因趙王昨會太白金星告兆燒獻錢幣贈吾恩主真武照疏收外出剩錢五萬遣吾换易凡財椿管趙王使用訖言畢商人不見疇具實奏上覽喜慰不勝至二年三月一日百官陪駕升端明殿論議諸道侯王各據山河纍征未剋事俄頃黑霧靉靆殿前四目不通丞相趙普獨邀駕登孝成殿方坐仰見雲際一神人恭揖皇帝遽降啓曰皇基鼎祚運新昌堯舜須依人唤將莫似后奢才得位逆姦依玷亂施張太祖躬問聖者何職降曰吾非土地職係天都右勝府事吾欲適燕地乃遙聞聖慮特當駐報吾曩赴三天聞宋僣不踰紀帝普躬謝聖論間真武辭升至建隆三年秋據河北二路申聞兩載旱荒軍民乏糧事大不堪官吏莫能措畫忽於七月七日清晨二十軍州各有粟麥堆垛盈城縻袋縫記總是黑雲馬紙粘糊況其物貨無主亦無夫腳州軍互審申奏朝廷三司看訖回旨物貨豈得無主蓋是國家德感真武出天倉粟麥垂濟二路攢計已得十五萬石仰低價賑糶接活軍民方蘇上聞喜曰恩非小可曷敢不報遇真武降日帝躬駕玄都殿香火瞻敬按董真君降筆云玄帝以道德開化如天地湛然默有成功之理無一時不念衆生無一刻不憐下土每知劫數必先以開濟之誠上奏金闕胸減分數至於蠻夷猾夏之處亦行教化可謂大慈普救無上法王也祛妖攝毒凡被妖毒災眚干擾之地未有不隨人愆業乘染也大抵皇天無親惟德是輔唯君子正心則自然感格玄帝威光祛禳制攝諸不祥事啓聖記云趙州石光祖乃右勝府下副參謀官謫降佐輔宋三十餘年至太平興國初拜觀文殿大學士右諫議大夫解逝復還北極職事矣從弟尚書禮部侍讀石光嗣出鎮洪州兼知此地及潭鼎衡鄂荆期連蠻貊當被七十二猖神橫流邪毒枉害人命況彼一帶居民少親正教不識醫藥惟務左道祭賽南神況斯民盛習此等妖術自號金剛法事施用油火刀刃移發狂魂巫言患家實幻惑財物也光嗣禁止竟不令行遂命羅浮洞道士淩居邈章醮懇禱真武俵散聖號位牌教民奉事儀式於下降日咸誦經呪積有歲月其左道妖民猖神邪毒悉皆潛伏矣又淮陽軍進士陳拱臣幼年獲一小龜其狀異常收養于家一味食棗拱臣洎登科之歲頓然龜大無何一宵龜身負一赤蛇盤繞拱臣知是祥瑞求畫真武聖容一堂延供久之禱無不佑拱臣擢信陽參軍忽承轉運費瓖委充監修築城部轄役夫值冬疫癘流行軍民染患久滯工役拱臣悶坐恍見龜前作人語曰吾聞參軍部役遭瘟特來獻祛禳之呪曰天罡天魁立驅電霧施我陰功狂橫速去一氣念三遍仰面向西北方收氣吹水盂中用楊枝濡灑患身即愈略此悃謝見養之恩吾今還北極事言訖而覺既行其驗立應忽家書至述養龜已失同夢時也修城完日以由呈稟漕臺瓖詳體具奏朝廷回降旨下就信陽城建立水火二神殿呪文勒石永為救民仁宗追封敕賜二神號曰神龜同德佐理至應大道顯眀武濟陰威翼聖左正侍雲騎護國保寧輔肅玄初太一天大左將軍聖蛇同德佑理至惠誠重威慈普濟陰辦武聖右正侍雲騎護國保靜輔肅守玄太一天大右將軍以副上意切切為之以副上意切切為之之句是玉童繳白玄武將軍遵命也玄武辭謝誥職出離北極之宫即日赴右勝府置理任所委公事矣太上説玄天大聖真武本傳神呪妙經卷之一
