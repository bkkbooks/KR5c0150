front:
  text: 太上説玄天大聖真武本傳神呪妙經卷之三
  hash: sha256:e0adcc43952d096b6ca724c98923a2e0efc0d1c1ec76bb00a2fa2c3f76566f1b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0150_HFL_003-001a, image: hfl/0530/0530-130.png}
body:
  text: 鄽人方田子佩升玄內教籙陳伀集疏是時真人再拜稽首曰臣之慶幸荷此綸辭妙行稱讚紫微敷演乃經綸端緒之教然其玄武之將軍乃玄元之應化其始之迹其事云何願賜詳言以開蒙鄙蒙者不智也鄙者不慧也故妙行謙和宣明開析玄武詳節普使會衆咸聞靈因亦願三界人天盡知玄武妙紀深趣之旨要也於是紫微大帝敷以玄言釋彼所因解無上事昔大羅境上無欲天宫淨樂國王夫淨樂國君能聖哲主務而感生玄帝繼踵於考命終日得乘生前所種清信功力命超無欲天宫衣飯天之厨箱受諸快樂自然虛皇經曰人有千善福及七祖死魂為仙萬善既備玉符下迎千神來朝白日登晨玄帝修真果效奉天詔曰九五老天君降言曰子之聖父聖母已在九霄矣九霄境乃玉虛無色界中列三十六天宫總隸大羅三境玄帝父母得居龍變梵度天無欲宫中按紫光經云淨樂國境乃海外仙國在西域月支國之西星分奎婁二宿之下善勝皇后夢而吞日覺乃懷孕其母氣不納邪日常行道既經一十四月乃及四百餘辰於開皇元年甲午之歲三月三日午時降誕於玉宫相貌殊倫後既長成遂捨家辭父母按降筆實録云玄帝降誕時正當上天開皇初劫乃下世黃帝紫雲元年歲在甲午戊辰月初三甲寅日庚午時符太陽之精託胎化生産母左脅當生之時瑞雲覆國異香芬然土地皆變金玉瑞應之祥兹不盡載立小字曰安于生而神靈舉措隱顯年及七歲經典一覽悉皆默會仰觀俯察靡所不通潛心念道志契太虛願事上帝普福兆民於是父王不願抑志年十五再辭王許賜道號曰潛雲子按實録云太上賜玄帝李姓蓋取宗化之源按西域國西州天山壇降筆載聖父玉諱告姑沃切玄帝玉諱乞按啓聖記玄帝應化唐時裴姓諱仲芳按本生經祖諱牛孳宗諱端受右暗諱四字賊瞎言乘凡對聖席語宜令勿犯上諸玉諱本經內有言乘二字可密音默誦之以當回避也如獻欸投詞祈求所欲者於玄帝疏內無得書犯諸諱字諸兩字諱者不許聯用如是單用一字書令字不完入武當山修道四十二年功成果滿白日升天玉皇有詔封為太玄鎮於北方顯迹之因自此始也武當者古名太和山按九五經緯天地曆曰禹平水土之後分治九州拜立五嶽定封四瀆範圍厚載之德名山大川悉以神聖主之乃考翼軫之下有山曰太和故老相傳云上古玄武得道飛升之地更太和之名就封曰武當山按實録云王子離宫尋訪幽谷遂感玉清聖祖紫元君授無極上道元君曰子可越海東歷於翼軫之下有山自乾兑起迹盤旋五萬里水出震宫自有太極之時便生是山上應顯定極風太安皇崖二天之下子可入是山擇衆峰之中沖高紫霄者居之當契太和升舉後二千五百歲龍漢四劫中當披髮跣足攝坎離真精歸根復位上為三境輔臣下作十方大聖方得顯名億劫與天地日月齊并是其果滿也語畢元君升雲而去王子乃依師語越海東果見師告之山山水藏沒有七十二峰一岑聳翠上凌紫霄下有一岩當陽虛寂於是採師之誡目山曰太和山峰曰紫霄峰岩曰紫霄岩因卜居焉潛虛玄一默會萬真四十二年大得上道至黃帝紫雲五十七年歲次庚寅九月丙戌初九丙寅日自清晨有祥雲天花似雨而下迷漫山谷去山四方林巒震響自作步虛仙樂之音王子拱手立于紫霄峰上須臾雲散見五真羣仙導從甚盛非凡見聞悉皆降集王子稽首祇奉拜迎五真曰吾等乃九五老天君準奉三清玉帝詔命與子啓途日當午五真宣詔王子再拜稽首興受詔領賜品儀易服訖乃斂圭奉乘飛雲玉輅羽蓋瓊輪上升朝赴九清境矣夫玉皇有詔者是斯經內一百六十八字天書篆文也承此赴除太玄之職方始顯迹於凡知有所修之因也真人稽首再拜白紫微大帝曰玉皇詔封必有妙旨敢問大略以開小聰爾時告於妙行曰天書祕密何可談揚恐泄天機深為不便大梵隱語奚使衆聞北極中天紫微令事遵佐金闕昊天發敕讚勞褒勉約束論事而已時依應三清玉帝璽書頒降準事施行畢謄祕于紫館況明真有格未易冒禁露談寶訓恐致輕泄之愆也於時妙行開存衆之誠請問大帝旨意之故謙謙然寶惜特為遏衆信結誓立盟使夫理志合儀者矣妙行真人拜手稽首復奏言曰臣雖緣薄聖必恩寬曲念衆真特垂大便苟輕泄慢當墮惡途萬劫千生長為下鬼六趣雜染輪回總號惡途應是冥官幽吏皆曰下鬼是時紫微大帝念此真人著意勤拳再三請問遂宣帝敕以示衆真拜手者執簡啓壇禮跪也稽首者俯首至地俯伏也三請者則九拜手三三俯興也妙行殷勤奏請遂乃設誓雖緣淺薄不敢口敬心違違者甘當處下鬼之趣勤拳為衆三請蒙大帝敕旨遣給事侍中啓琅函玉匣出示玄武飛升天詔宣唱也夫此祕言金書篆字大方一丈號曰天符見之者永處天仙聆之者不歷地獄言夫此祕者顯昊極三天門下金闕誥命璽封奬其天符尊崇也按實録云符篆詔製乃天真皇人撰及書也字大方一丈者則八角飛芒各一尺篆迹也曰赤書玉字之體以金錯成形也得永處天仙是斯會無極仙曹咸獲瞻見當增其品秩矣次聆聽者因東漢之季太上降蜀授徵士張真人道陵玄武之經使流傳于世張君乃以金篆詔書文義易作凡間書體浹濟學道之人使夫誦念及聆之者保育腎官太玄之氣堅固耳宅門户之聰使地司黑簿無得書執曾歷八百功德之人也是等學人命終之際死魂不當墮入地府獄中按天師杜光庭集道氣初布混漠無形氣凝於浩莽之間文結於太空之內曲折成字八角飛芒元始命天真皇人象形摹寫名曰天書玉篆乃為文字之祖體也其詔文曰此經天符詔語乃依降筆實録本書金闕昊天三省門下牒奉敕學仙聖童淨樂王了七歲神靈淨樂國子十五志道辟國二親惟卿玄元之化太虛本氣玄元化生天一之尊太陰天一紫皇尊身不言而教守中忘言授學元君莫知其神莫知帝象惟德至神渺渺劫仞善釋魔刃歷劫解紛綿綿若存鎮護元氣綿綿長存虛心實腹清心寡欲抱一順真和光同塵守昧同垢韜光晦明鑿開造化𨯳𨴋虛已鎔化至精朴散胚渾雕琢覆朴塊然胚渾六百萬歲延康劫初紀至庚寅八十二身五靈老始玄武後形曲今枉直詘己證道舉衆伸人窪盈幣新若水下物度幣革新生陰育陽陰生陽育女癸男壬起死成人恐人天橫衛生留經其功不恃興益利施亡執恃名其德乃真不希上德真靜常清今宜再顯吳天宜命太玄悖與永鎮北旻秉斯公治專政愍民上罰逆象祅精逆象輒現與擒下滅妖氛邪氛侵氣妄逞收平掌握圖籙掌握宇宙極圖誓盟攝制魔蹤鎮伏魔勞大刑攝擯帝真靈會帝真生理鑿術宏巨驅神駕龍駕龍馭駿統七號兵甲庚之將特紀綱賜驂甲轡庚贊衛爾動克成贊術蓋署元勳周環六合十一分野按月日巡普福兆民分身下降普福乾坤道參天地大道參校可詔飛升萬真所推九清萬真齊賀帝庭可特拜太玄元帥領元和遷校府公事册到奉行紫微乃言告真人曰此文者玉皇祕敕天帝徽宣不可輕傳恐遭降責紫微大帝所寶三宣初敕曰天書祕密何可談揚恐泄天機也次曰玉皇祕敕不可輕傳恐遭降責也末曰非乃至人祕之宜也誡授受者恐口敬心違也因緣經曰凡人現世長命富貴者往世曾敬信大道妙義中來永劫家勢不衰者曾延奉正真及成就功德中來處世為人才識明了深通妙理達性真者曾持寶經不妄傳人中來也真人稽首又白帝言臣聞玄武將軍神通至大不居諸位而鎮北方妙用之因神明之契必有奧旨願釋鄙懹妙行復問玄武洞妙因何專政位居北方大帝遺音告真人曰天中北上衆曜拱之以匪至神孰能鎮遏中天北極之中建紫微帝庭也元和遷校府署乃毗紫庭之北且玄帝偉政位天官四帥之右導森羅萬象之前故經曰衆曜拱之職事準玄帝功業可當也每羣真會朝昊天至尊則四聖為都班之首實録云元始升玉宸殿內大會諸天上帝校遷三界羣真登命九天司馬侍仙玉郎啓太丹玉匣出萬天素威功過玉曆敕金闕侍中司馬大神韓君丈人金闕司命可韓真人金闕司録定名玉曆真人金闕司功九天採訪真君金闕司過九天儲福真君並開曆考績三官四聖之職自太虛開化神一挺生有保天佑地化育之功奏上三清乃命玉帝親行典儀當亞帝真之號遂詔玄武詣闕登七寶瓊臺之上遣金闕侍中素靈殿大學士三天門下直日儲靈典奏事金真紫陽大夫含光上德仙君軒轅執本齎捧昊極三天門下玉册傳命宣賜玄武儀錫以通天十二旒冠玄衮上施日月山龍物象玄玉寶圭紅舄玄履瓊旌寶節九龍玉輦玄武拜受易服訖仙君謹言玉宸三省誥曰皇皇大道赫赫至真太極開判玄元化生妙藴樞機萬天尊仰則為聖明主務其休隆廣焉敢不崇欽惟太玄元帥鎮大玄武大將軍三元都總管九天遊奕使左天罡北極右垣三界大都督依前領元和遷校府職判玄都右勝府公事太上紫皇天一真人册曰靈通太妙上開混化之玄道備鬱明下統虛危之秀寶育天元撫成地紀持造化於四時推紀綱於八節分身下降普福乾坤功齊五千萬劫德並三十二天九霄上賴於真威十極仰依於神化有大利施於下民積聖德遍於玉曆按遵簡籙當亞帝真敢不徽崇何以明德賜尊號特拜玉虛師相玄天上帝領九天採訪使金書册寶曰夫道生一氣感化三才結真于九極之華晨麗于六天之秀幽微煒燁洞杳飛芒功高難極合示嘉尊想惟鑒觀幸勿謙辭餘當上輔大道劫劫長存下佑兆民綿綿永祉龍文昭降永祕玄都謹言崇封聖父曰淨樂天君明真大帝聖母曰善勝太后瓊真上仙下蔭天關曰太玄火精含陰將軍赤靈尊神地軸曰太玄水精育陽將軍黑靈尊神並居天一真慶宫仰觀玄帝之勳業在于今日之權總司三界功過事況真休尚賴其威輔而神通果至大歟真人乃啓於紫微若有天人志心欽仰其於福利有所得乎妙行真人思正萬彙順天人之心仍問欽敬福利將化人天歸向耶大帝曰此神將是歲每月六日十六日二十六日諸天審察此諸天者乃是色欲一界天境公事玄帝之守巡歷審察二曜三辰五行萬象星府事彈鎮不正妖彗也故本經曰每月三度統領神兵躬往諸天遍為巡察凡遇邪氣及有妖星速須剪戮是斯職也色界天屬上元三氣君召諸天人眷屬事中外一十八天主尊謹著睿號中九天五氣天君主北方元靈上極天始素天君主西南妙靈寶華天九氣天君主東方玉華無極天始丹天君主東南大虛真極天一氣天君主上方玉清虛皇天始玄天君主西北素靈皓元天七氣天君主西方玉靈素華天始青天君主東北太靈真元天三氣天君主南方南極玉文天外九天智德天尊主北方雙闕化身天威範天尊主西南至妙變空天仁愛天尊主東方元真寶曜天慈和天尊主東南開靈傳道天載德天尊主下方中極總生天成化天尊主西北元關溥濟天義議天尊主西方成德曜晶天智積天尊主東北暉明流光天禮教天尊主南方太平運化天色界乃無五行之所其中天人眷屬衣飯天之厨箱也本因是從凡修鍊之士而及之靈寶經注云人有百善東華注名以至三百善去身業歷淨行命終蛻殼神隨功著飛舄此境也於中增修及千善者福延七祖神魂靈魄聚為眷屬也欲界天屬中元三氣君召諸天眷也其六天十境最居下位接人間頂題名于后諸天睿號善勝天王尊北境他化自在天妙化天王尊東境樂變化天妙德天王尊中境兜率陀天清淨天王尊南境須焰摩天靈和天王尊西境忉利天淳和天王尊護世四王天中央東方境主持國天王南方境主增長天王西方境主廣日天王北方境主多聞天王靈寶經云人有十善司命儲算至五十善五帝友别三業漸除形神少忘得返五行之妙天命終際神魂徑超此諸天境受大快樂也況夫玄帝稟命常保育天元矣十洞巡遊十洞者乃十大洞天也巡遊警察神仙公事也按朝天懺應洞天所各立仙官曹僚分掌攢集萬彙籙籍功過等事及正月七日二月八日三月九日四月四日五月五日六月七日七月七日八月十三日九月九日十月二十一日十一月七日十二月二十七日下降人間剪滅邪魔驅除瘟瘧保人慶壽以全天命其有氣正心純忠全孝盡名書玉簡保舉升仙更有玄科莫可併述真人稽首再拜白紫微大帝曰顯化之因則聞命矣天人欽仰玄武將軍作何歸依設何方便而得福利幸賜一言妙行請問歸依之人設何供禮大帝是時告真人曰天地之內能有至心奉祀玄武一生之內不食鯹音星羶自斃毒傷穢之物及於蕌音小菜大蒜葫荽耽淫嗜欲扶尸接産若能斷得方可志心凡臨下降之辰皆有禎祥之慶大帝語天地之內者謂天下地上大千世界中人也能有志心奉祀玄武者勤修香火之家誠謹信奉遵依此經避忌之人實於衛生利益按應運經曰飲食隨緣不必勞神不必著見飲則通其色身血肉食則充其色身臟氣按靈寶大誡經身中元神惟務清淨不可雜食臭腥臭腥之物壅滯經源纏羅六腑又脂葷辛臊昏塞神門攻蒸五臟生諸病惱人不能知形神豈久可聽此經保人天年以除災患此乃簡要之法所宜遵戒也腥羶者黿鼉龜鱉蛇鱔黑鯉魚曰臭腥食也牛馬野獸肉曰羶自斃毒傷自斃者乃活動物命無故死也毒傷謂猛獸攫擒食之遺剩自死及雕殘食之多命促此之謂也按孫真人食誡曰猒穢物者鴈肉猒犬肉穢藟菜乃小蒜也食多耗散精神也大蒜雖入藥久服反閉塞神氣葫荽其臭透人肌膚令人多忘藝薹韭薤已上總葷菜也耽淫者竭精虧腎玄武逝後嗜欲者敗氣散神朱雀棄前扶尸者死魘驚魂青龍離左接産者血腥衝魄白虎亡右或誤食忌物當念本經淨身神呪則穢雜之氣出雜於身內矣唯扶父母師資死尸候葬畢日外更吉服而可朝真謁聖也易繫辭曰天之所助者順也人之所敬者信也信者誠心晨昏上香朝扣玉虛之門志感太玄真人按旄部録所循之善申明右勝府事必降禎祥之慶光輝子之門闌漸進則天佑之也其夜聖降之期預先一夜也先當澡瀹身心不汨思慮先當澡瀹可預除身垢孔子曰沐浴為齋潔也非為飾也不汨思慮者却去胸中亂事太上曰澄其心而神自清又曰形神俱妙與道合真至五更躬然香燭淨果棗湯香通真達誠唯降真沉香可燭貴黃蠟者輝明祭祀淨果五果忌獻石榴李子棗湯沸湯瀑日曬乾棗尹喜內傳曰神仙多以棗宴賔也淨水亦佳設淨水因昔唐追封太上老君為祖也憲宗幸廣平苑夜坐于軒睹真武降現威容立于雲際帝炷香躬問奉祀天曹儀範真武降言爇香者可達誠誠非香則不能達于穹蒼也酌水者能滌穢氣一切清淨皆由此生故供養不可無水也語畢帝謝真武升天矣乃元和元年八月初八夜半降唐禁中故事也觀此豈上聖所欲哉我當表誠遵此位列有三志純于一位列有三者遞歲三月三日玄帝宴聖父聖母於瑶池玉洞天報答誕生之辰香一炷燭二枝淨果棗湯當設三位分志純于一者餘諸降日只用設一位分香燭果湯稽首禱告無願不從凡禱正念者上聖無不從人所請啓聖記云宋朝仁宗皇帝因轗軻問詔命道士洞神法師王伯初庭對休咎事於登壇日燒化御封心詞俯伏出神齎表達上穹翌日敷奏臣伯初昨趨昊極奏對罷朝回至西天門葛將軍見報曰真武已保明蒙玉帝御筆敕旨賜延聖壽一紀帝悅賜御筆璽記贈真武銜嘉祐二年正月日敕準寶應閣長生玄都殿賜銜也謹鋟于后降真讚曰萬物之祖盛德可委精貫玄天靈光有煒興益之宗保合大同香火瞻敬五福攸從詔書伏以靈天肅正俯降塵寰通明護國定亂殊聖現前感應施惠救民顯照圓成所禱悉從是願所求皆有證心不但國王大臣道僧士庶一切有情能恭香火普及所意無不果遂以斯福善住世專事濟人承恩者庶廣不可思議今既獲于聖佑於國於家豈擅忘於大道延福增齡永祈保祚除已行恩天下啓聖奏章一百四件並係功成正化謹就玉津園建其聖堂報答天鑑得蒙現足垂靈仍賜為社稷家神崇遵真武上聖宜可授玄初鼎運上清三元都部署九天遊奕大將軍左天罡北極右垣鎮天真武靈應真君奉先正化寂照圓明莊嚴寶淨齊天護國安民長生感應福神智德孝睿文武定亂聖功慈惠天侯右準敕宜令祀授龜蛇贈封施行其龜蛇二聖銜注在本經前祛妖攝毒之句下也然乃靜思虔誠誦其神呪然者道指也靜思處靖廬坐也虔者慤誠者信誦者念其者斯神者神明叩齒誦呪呪者蓋以聲發禦邪虛皇經曰身垢不淨以世水洗之心垢不淨以法語洗之或自首罪亦自洗也北方玄天杳杳神君億千變化玄武靈真騰天倒地驅雷奔雲隊仗千萬掃蕩妖氛雷公侍從玉女將軍鬼神降伏龍虎潛奔威鎮五嶽萬靈咸遵鳴鍾擊鼓遊行乾坤收捕逆鬼摧斬魔羣除邪輔正道氣常臻急急如元始上帝律令按紫光經云此神呪出神寶君祕書也太陰化生水位之精虛危上應龜蛇合形盤遊九地統攝萬靈無幽不察無願不成劫終劫始剪伐魔精救護羣品家國咸寧數中末甲妖氣流行上帝有敕吾故降靈藏揚正教蕩邪辟兵化洽黎兆協贊中興敢有小鬼欲來現形吾目一視五嶽摧傾急急如太玄律令敕按行道品經三洞大法九品第九曰神呪能驅除疫癘掃蕩妖氛蠲却精邪最為第一也太上説玄天大聖真武本傳神况妙經卷之三
