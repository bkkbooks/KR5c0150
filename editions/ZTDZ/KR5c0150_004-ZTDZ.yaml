front:
  text: 太上說玄天大聖眞武本傳神呪妙經卷之四
  hash: sha256:33127928abe938ec105d463642fd414b694aa23010d5275fac4110326d1e9879
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0150_SJB_004-170119a, image: sjb/17/170119a.png}
body:
  text: 鄽人方田子佩昇玄内教籙陳伀集疏妙行眞人曰功德之妙顯應之因幸以竊聞頓開迷懵其有蠻夷之輩愚蠢之人耳縱得聞心無所信設有果報可示一言眞人已得扣知玄武修身功著德行明妙顯靈應化隨因成就一切歸依含靈人也又乃攝問愚蠢之人蚩蚩䜙䜙蠻夷之輩嚚頑不達豈敬天地誰信神眞然各有條例報之有不信重玄武者其報何若哉紫微大帝曰雖云愚蠢必識炎凉縱處蠻夷須知苦樂大帝捷證去妙行之疑曰炎熱凉寒苦愁樂喜且誰人不識知歟於是世人歲月迍邅太上先遣胡老君同角亢氏房心尾箕行化東方九夷之國羌老君同斗牛女虚危室璧行化北方五狄之國氐老君同奎婁胃昂畢觜參行化西方六戎之國越老君同井鬼柳星張翼軫行化南方八蠻之國傖老君同魁𩲃𩵄䰢魓𩳐魒行化中央中原之國禮記曰五方之民然則語默不通嗜慾不同則各有安居和味宜服利器旣爲物中之靈豈不知識苦樂炎凉者哉如到此地者必懇謝上眞也霑恩者豈忘奉祀信則神魂清爽信則者能誠行五常法則也自然神心清潔魂意爽明矣元君曰人有一善心定體安虚皇天尊曰人有一善百神俱泰目人有者因暗循而果穟況千善萬善必躋大道矣違則禍患縈仍違則者是非義而動背理而行者也因惡稔至期禍患縈仍旋繞困重而頻遭矣大帝造慈略警此之八報也世有勤奉玄帝香火者則灾隨電散福逐雲生致使富乏兒孫人間五福一曰壽二曰富處富地者福矣無子孫者孟子以爲不孝之罪昔華封人請祝曰願堯君壽富多男子堯不願祝育子不肖如無位同舜壻也子亦如之襌位臣禹揚子曰螟蛉之子殪而逢蜾蠃祝之曰類我類我乆則肖之矣速哉七十子肖仲尼也且以堯舜事比之足可見之孫事聽上帝命元君曰人宿世有五十善得見世子孫繁息立九百善者世生賢聖也應運經曰大道鼎分西方曰佛名南無常觀自在境立普門願從人所請欲設復世人禮拜供養求男生男求女生女況玄帝及三茅眞君亦從人所願豈不聞王植朱牧之事因乎按啓聖記皇佑年間冀州觀察使除殿前檢校王植妻壽昌郡君焦氏見後園石榴樹一枯枝煙發以水沃化成圓光現眞武焦氏拜扣凡塵賤骨幸得遭遇上眞降救度兒身也妾聞終身無嗣大爲業賤眞武遽降慈㫖曰遇吾釋願汝之誠感也可候來年三月三日祚眞觀内與汝一子焦氏拜謝竟失聖跡歸白夫主迤𨓦至期夫婦同詣是觀炷香於稠人中忽逢一子兩手拽定王植焦氏約六七歲云無父母植引歸教養自然聰敏作親面奏恩澤仁宗宣問知卿無嗣植一一具奏來因上賜名王淵許越國長公主爲親武舉及第册寳充附馬都尉賜宅又啓聖記饒州樂平縣人朱牧登仕版處政公平居鄉謙謹一生恭勤眞武香火自念無子適七月七日聖降夜妻云纔夢一道士自袖出碟盛棗一枚飼我曰天錫仙人棗也令我吞之味香透體牧齅果異香徧室矣至來年誕一男子就名天錫五歲記誦聰敏七歲名播四方承神宗詔宣天錫登殿試誦經史百家並無訛舛又能捷對御題上悅賜承務郎及買書金幣三司看詳朱牧神童亦爲國家祥瑞漢相陳平曰我多陰謀道家之所禁忌吾世則廢矣乎自知致富貴地乏子孫也按保嗣章嗣續衰微者宜贖命放生解之也貧多子息原憲曰吾聞無財者謂之貧孔子曰貧而無諂顔曾之謂歟且顔回亞聖智曾參大賢人尚墮于身貧之報而況有諂乎貧多子息者乃宿尤也天文洞章曰生遇困窮無所依託復有寃家會遇作諸眷屬日月憂惶共受貧薄遭逢凍飢一時難以解釋但息惡念不生怨意是名内和必可速離諸障漸圓成也若憎妬不息墮入惡趣矣趙起感夢録云一夕夢後妻前夫尚書員外郎李庶到起家再拜求謁曰幽府今責吾定罪日訖只今託生七帝坊窮巷内劉家作女身也吾聞渠家其貧猒多子欲殺吾難復人身矣言再三曰痛哉辭謝訖揮涕哭而出也起覺語妻范氏亦云如斯夢意黎明急訪劉家果生一女將沉溺于水中命在須臾趙起贈金救李庶脫溺死之地也大抵貧富倚伏天理變更誰能測之試且以吾一鄉觀之不十年間貧富反覆子息增損又何嘗無聚散乎凡有識之士常樂貧奉正候造物自成矣按啓聖記載宣城有閭民唐坦者家多子息安貧守分度其生也唯季子唐憲承接祖宗家堂眞武奉祀香火未嘗私替忽值冬雪霽遇一窘客出一銅像坐相眞武來投憲賣償價贖之迎歸家舍香湯刷洗其垢淨乃是眞金約重五十餘兩憲忌收價不登述情捧納入官本州正剗刷上供錢帛就具因由併進續據朝廷回降劄子看詳金像眞武自進入内院光明圓赫顯是異瑞仰宣州支撥省庫錢五百貫給付唐憲充折金價憲請領歸家均付兄弟忠愈願等子姪各營生業不日皆爲富厚之第憲捨自己分財重新建造太極觀殿答謝眞武佑賜也大抵貧窘之人常事當隨分受今生之報況寒谷亦自然有春氣到日也或男值兵戈而殞命男正位乎外尚忠良盡其道而死者正命也棄忠良逞猛愚者必當逢兵戈殞殁則死非爲正命也禮天官曰良兵良器以待邦之大用故知兵本人立干戈兵器也史律詩云兵者聖人所討强暴平亂世奈何外有四夷寇擾國境内起猖獗叛亂邦疆大抵數也皇天無親惟德是輔耳老子曰樂殺人者不可得志於天下矣胡不聞王顯陳疇之事乎使相王顯淳化初年持節知定州忽一道士破冠弊褐鬚若剛鬛口角至耳詣公廳刺謁乃自稱曰吾管轄酆都觀公事昨準上帝牒下蕃魂二萬名吾今未與收入死籍在公殺不殺宜自擇公若果殺雖名彰勳重天曹反减公壽十年顯謂强人不聽怒叱之逐出未幾契丹有兵侵入邊境獵梁門寨對壘乆之適天雨雪疲困兵乆公乗彼無備坌兵夜擊之擒敗卒次日戮於築京觀側計首級二萬顆顯方悔悟事追不復及奏朝廷蒙重賜褒詔除樞相不旬日果暴卒啓聖記曰宋朝户部尚書陳疇出除越州忽承詔宣再令赴闕事涉頗疑疇躬詣乾明觀登眞武殿炷香禱籤獲黄眞君第四道辭意良雅呼夏禹廟祝鬻籤楊昉詳斷昉曰公必當建旄節討東北鬼路猖獗之事此籤非吉兆也去則應在百二十日主定惡死公忌令昉勒伏狀繫獄姑候其驗疇至闕庭果授鄆州持節安撫領兵馬都鈐轄事出討齊州虎頤山獗黨軍劫何清等事疇纔接兵夜遭寇突罄騎蒼荒墜一崖塹無計支持忽電破暗睹一披髮神人仗劍招疇不覺同騎俱存于路漸而黎民得回坐營再約日戰清等伏擒疇具因敷奏一端詳節及繳狀保眀楊昉籤斷三省看詳特賜楊昉精藝一官按月給俸充夏禹廟香火事朝廷遣中使降御香下乾明觀章醮啓謝眞武顯靈神休也是樂殺人者立見促壽而死疇於死地而生太上曰又枉殺人者是易刀兵而相殺也或女罹婬孕而傷生女正位乎内慕清潔則閨門肅正也孔子家語云男子二十而冠女子十五許嫁然後道合化成惟命之端夫婦者義屬天倫父父子子也不謹行藏亡禮義欺暗室蕩女嫠婦通私情以偷期爲事女子迷惑私意交通懷孕偷生設殯隨之不懼罪福不畏惡報或臨生時多方狙詐圖絶人謗似此非一況官刑有禁禦男女無别之醜以防淫亂之奔又或有主婢私通婢懷娠妊其子育不育聽主母意及不與將理産身而亡非惟主母墮罪育主亦同或者又猒多兒女輒輕棄之然則世綱可逃暗中報寃鬼責漸至豈不聞穎娘與王堯臣女孕事及紀可信女誡世乎有穎娘者衒婬憂孕復厭子多暗自殞胎屢矣又復有孕亦用藥觸之血遂洞下伏枕六年若楚萬狀一日家人明見數箇提孩在牀挽撮琅然叫聲曰索命事穎娘方絶按普州記紀可信一女小名曰引鳳偶病入冥經日而還魂告其父曰兒初被二吏押入一城兩畔數處庭落門上皆有牌額及見一所門内無數罪人男子縛抱出火銅柱婦女壓卧大炙鐵牀衆多牛頭馬首之卒持㦸監押纔赴者苦聲悲慘兒不忍觀聞遂問立吏答云此償生前尚婬傷生之報也又拘兒行至一殿見殿中坐一王者左右紫袍牙笏班從殿下俄頃押至衆多荷枷婦女各被嬰孩扯捽有寃聲云索命事王者詰由不輟須臾皆斷結訖兒聞送還生人道骨肉聚散貧窮困苦分裂絶嗣婬穢之報紀可信聞依語書爲世誡矣啓聖記載舒州金部員外郎王堯臣親生一女未婚若妊二年不産恒令二婢伺察奸邪女忿其恥奔園自縊忽聞有聲自空叱曰女子未可枉𢬵其命婢聞馳救解繩將歸公聞諤訝召靈仙觀道士陳居巽具因申禀家堂眞武間女忽自附神通說己過前身乃是藥婆暗貨毒藥與人打胎枉殺貴命有此罪咎上帝震怒罰我今身受耻辱之報毒氣衝塞心腹若孕今得遇上眞脫自縊死免墮他趣言訖而甦堯臣即醮謝眞武之恩警播於世生神章曰夫人得還生於人道濯形太陽驚天駭地貴亦難勝於爾何負而乃肆殺之棄人及厭多生也常出入於訟庭老子曰知常曰明不知常妄作凶謂巧詐也頻凶訟出入公庭者不無欺凌願强勝耶孔子曰聽訟吾猶人也必也使無訟乎大抵官清廉乃能决曲直予奪一定兩訟伏矣若是不廉不智棄法受賂引縱頑民猾吏結交使諸屈者銜寃莫伸也惜其不知一法一律天曹地府水司皆主之陰考陽治刑政一以貫之反報無毫分差矣翊聖降言曰盡力事君政事謹勤濁財勿顧邪事莫聞整雪刑獄救療人民動合王道自爲吉人積愆爲咎必有沉淪福記雲吾被攝入冥司偶見同邑人郁丙荷枷二吏拘之泣訴吾曰縁我生前曾强侵鄰家張先空地三尺成簷溜水溝矣張先在世屢訴不行事乆湮没今在陰司訟我我今伏辜矣此情無由通達我子我子流落建昌張先子亦徒陜府且幽冥路隔今幸君還煩賜一言之重拉吾兒速割還地庶吾得决不然永繫于此也福果還魂特與决之聲播於世矣啓聖記載蔡州百姓錢舉誣親弟爲異姓財産數萬不與均分結賄官吏弟訟不伸經御史臺檄下許州差通判徐沂往蔡州置獄鞠勘間被推司楊仲和受舉賕裝點公事將干證人朱惜姐供狀换弄爲非沂鹵莽失究科朱惜姐臂杖十三斷絶無辜矣沂任滿磨考䶗䶚不行因就天慶觀命道士裴君叟投詞保助轉官自更闌焚詞伏壇至四鼓方興君叟謂徐沂曰吾到三天門見北極大帝領眞武入奏公斷蔡州錢舉公事不當遽蒙㫖曰徐沂心詞只留在此恐金籙召問汝奏對必有差大恐不便吾即便回之沂聞大懼未幾乃卒時推司楊仲和驚怖辭吏棄財施貧造善勇於改過財盡鬻籤日糊其口命終尸解眞武收録充東嶽麻溪注禄主簿事達聖聽敕封楊仲和號悟本府君就許州建祠令人享敬矣比之以曲爲直刑加無辜乃是違法徇情惹健訟者滅親壞教豈不畏天地眞司輒言上帝降罰至時看君如何逃乎每沉淪於苦海每者事事也沉淪者行藏汨没也苦者自煎熬也海者喻日生無窮世事也兀洞玉曆章曰苦海喻之火宅而牽世人貪迷執著魍徒相結不知劫會惟樂衆樂卒無定安火乃燧人所出化爲炎苦之海佛說四相受縁愛愛縁生生縁老病死是煎熬之苦出没膠擾浮沉曰寰海太華上人曰以利返之以高下之以前後之以貴賤之以衰盛之不執不著不貪不慾人能奉行乗渡波涉湍之筏也清淨經曰衆生所以不得眞道者爲有妄心旣有妄心即驚其神旣驚其神即著萬物旣著萬物即生貪求旣生貪求即是煩惱煩惱妄想憂苦身心便遭濁辱流浪生死常沉苦海永失眞道碧虚子曰人爲一器俱屬塵中日烏月兔交馳積成起滅天關地軸旋轉倚伏輪迴悲夫世人放七情縱六慾務快身心貪嗔癡殺盜淫生死難度豈思生前暗削禄家遭横禍除年死後則業海潜地拘魂謝罪懺云人間之北有大荒溟渤海其水腥穢無邊中有酆都羅山上參碧落下入風泉中置九幽立三十六大地獄專爲整雪死魂生前罪戾其中所尊者北陰酆都大帝總判刑名都司洎無間一十八大阿鼻地獄及二十八宿治圄皆爲理寃之所獄中草木甚於劍㦸猛獸玃擒噴煙吐火爍空蓬勃晝夜不停獄官鬼吏忤執不慈拷掠囚魂豈容情哉太上聽設地獄境界乃人平生作業受報之地也啓聖記載眞武上詣太清境朝謁本師太上老君告曰吾以汝降伏天下妖魔清寧宇宙尚諸衆生競赴輪迴經歷地獄汝當普度見善者以福加之化惡者以善解之汝宜更修其果眞武遵奉而作頌曰衆生造善與吾齊身我登證果亦同好因說是頌畢跪辭回職府乃垂世訓言夫欲修仙道先修人道人道者恭謙美衆慈惠温良濟物利生欽心奉節儉事親修仁義行方便强莫騁勢莫恃憫孤寡垂慈念此人道也人道尚不能修去仙道則遠矣銷磨産業士得田供祭民農田養口賴四時造化五谷豐登雖一升一合之菽各有分受矣或者田園徧野倉廪盈溢尚生窺覬他人腴産墨子曰非無安居無安心也老子曰咎莫大於欲得應運經曰將來于世衆生昏沉不能知覺復欲遠求廣利强立世世豐厚子孫徧侵土地立棟成宇此謂修業以待其報也大抵恒産田禄天付限節多寡自然豈苟婪得哉應誣婦産業並屬恬昭罪氣洞管攝目爲貪廣罪削爾田宅之籍陽與銷磨産業也玄帝勸文恬惔身心災穢不生惜物究性自然無病明察賢愚蹇鈍自無光明照了俗縈决少人若空靈何謂實蹤往來來往氣騰之精雄雷威電世民皆見速報分明天空顯現勿昩本心莫多慳占孝憐骨肉和美同眷里朋如親少貪多戀救困施貧忠誠謹儉滌除頑塵昆睦和宴執淨守清神眀贊願壽益無虧子孫榮健生不遭苦劫之纏死决免冥鞠聲辯今日吾書普勸文願得瞻之兇邢免能録十幅貼諸方時疫瘟灾不敢現若愚瞋謗我之言拘魂直送酆都斂耗散資財制命急務衣食最先必本資財活身潤屋莊子曰錢財不積則貪者憂廣求慳悋苟富而矣墨子曰非無足財無足心也孔子曰富與貴是人之所欲也不以其道得之不處也老子曰禍莫大於不知足又曰知足不辱虚皇經曰財爲患之本聚財如聚業財爲愛慾根能起一切罪多藏以其厚亡也惜其不知掠剩鬼使裴璞夢友人韋元方曰吾掌世人日用一飲一啄以至資財皆有所籍其獲有限苟過一物一鏹吾統鬼卒千萬皆與其掠之事屬酆都紂絶陰天總司主攝蓄非道之財遣發本洞鬼卒託生其家俟期與耗散矣按佑聖經保命眞人曰不以心妬賢恐天之禍不以輕父母恐天之怒不以毁謗聖恐天之灾不以貪非利恐天之損不以損於人恐天之墮不以害於人恐天之報玄帝垂降格言矯妄求榮名譽不揚剋剥至富子孫遺殃行恩布德福禄來翔寡慾薄味壽命遐長毋欺暗室毋昩三光正直無私赤心忠良天地介神明衛旁延生度厄必濟時康蓋縁自咎故獲斯因太甲曰天作孽猶可違自作孽不可活此神將所在獰妖縮首邪道遁形凡有建立玄帝聖像殿堂境域所在及所所在在筵設影像之家有妬福獰妖聞眞司則自當縮首或興灾邪道睹旄從則無不遁形是以奉之者福逐雲生灾隨電散詩曰昭事上帝聿懷多福翊聖訓曰加香虔答於高穹守性鍊伏於己體如能躬謹時有自然福慶相逐感瑞氣生矣瑞氣者一曰慶雲見爲喜氣生福之先鍾爲五福百福俱臨爾體福者於事緊遂順者謂之福北斗經曰五方降眞炁萬福自來并并者合輳也又曰削落三灾九厄保見今眷屬安寧書曰惟天降灾祥在德度人經曰萬灾不干神明護門雷霆兵吏常隨行府殄散灾異汝因懇問吾故泄機陳道紀於微源使天民之巨慶言雖簡要欲汝曉明非乃至人祕之宜也大帝語妙行果有宿因而今懇問耶夫道紀者乃授度之年載也用證玄武微妙源流也信奉者名天民受巨慶莊子曰人有脩者乃今之常有恒者人舍之天助之人之所舍謂之天民按上清眞訣云人生於世不知修道與草木飛走無殊者謂之凡人也凡人之中了然覺悟起心修道欲求長生者可習此簡要經㫖則妙行及我等皆可易曉明此義莊子曰不離於眞謂之至人荀子曰明天人之分可謂至人也非能明豈謂至人如昔韓元壽精思入室誦經不專一旦天火焚屋經飛上天於九十年中元壽化爲木精矣況今人輕授受之報當如何哉太上說玄天大聖眞武本傳神况妙經卷之四
