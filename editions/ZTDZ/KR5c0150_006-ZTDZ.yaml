front:
  text: 太上說玄天大聖眞武本傳神呪妙經卷之六
  hash: sha256:b8a3b4db31d9425d240f27b4c4161f52c18774d4974c7c78e5ddc6f62c10e01e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0150_SJB_006-170131c, image: sjb/17/170131c.png}
body:
  text: 鄽人方田子佩昇玄内教籙陳伀集疏妙行眞人上白元始衆眞矜彼衆生何縁度之妙行白紫微矜彼方事時元始前衆眞以何神用釋之天尊乃叩齒一通流光萬里北方命召太玄將軍剪戮衆妖救度羣品大帝證答以元始天尊垂憫萬類生死劫會未分之際當擬剪戮衆妖救度羣品者急故叩齒一通也謂道發一炁而生萬物也流光萬里者謂天光敕發安鎭威用也北方事北極紫微令遵行保制劫運之命也唯召太玄將軍上朝玉清聽元始告命而誅戮妖氛故運一而果全其萬彙也眞人曰不審此將而以何縁位鎭北方威降下鬼掃蕩妖氛妙行未全審此又問太玄將軍果能威討下方妖魔乎大帝曰此神未開造化先禀神靈易號假名度人濟物不伐其善不矜其能荷其玉帝封爲玄武大帝旣聞妙行深請故陳造道本因之答昔太朴未判時天地混其體日月否其輝八卦隱其神當斯爲未開造化之際也玄帝本炁果在其中矣故謂之先禀神靈也其詳註見在本經前八十二次變爲玄武之句下矣知易號假名應化下土度人濟物也故玄帝凡一出世興益教宗普濟物命博施利生行道人間而不自伐積成聖功而不自矜其惟道長也按元洞玉曆西華帝君曰昔壬癸分于太清以立次元之象運于水宫而源之水爲上善而非善己故得與天地一同而長且乆利于萬物而弗自利流渡萬物而弗自渡萬物昏塞染著無所不滌名曰備衆廣法也若諭於修持之道而以初進學功譬之其圓乃可速成也惟玄帝在幼時神靈施用妙于壬癸功感三天賜詔自飛昇日除太玄元帥事又能清寧天地荷昊天玉皇上帝敕荐封玄武大將軍眞人曰焉得此將而往下方咸度羣品免遭橫死亡者解脱存者康寧妙行歷問金闕叩齒流光便爲命令焉得此經徑臨受禍之境爲討罰及安鎭乎天尊以飛符召之紫微大帝以上言爲答也元始洎出制命乃號飛揚隱語之敕也其文乃本經中鎭天魔神呪是其辭義也凡持此呪誦聲一出期會玄帝大信謂之速召法也此將玄武蒙詔神兵從行至不夜之丹墀丹墀乃殿陛也玄帝奉詔赴太霄八景闕庭混洞赤文章云九光之炁結成九霄不夜之天也睹强名之大道老子曰吾不知其名字之曰道强爲之名曰大故稱元始號大道也作禮長跪稽首進言今日何縁蒙符特詔慈顔幸睹妙㫖何歸竦伏軒墀俯膺令命是時玄武朝謁俯俛拳拳伏胸遵聽用命也降筆實録云元始說法於玉清聖境天門震闢下睹惡氣衝突彌塞天光乃命玉皇上帝降詔詔北極紫微令紫微大帝遽辭八景御座即准奉昊天敕㫖玉牒有命備坐曰陽則以周武伐紂平治社稷陰則遣玄武收魔間分人鬼天尊告曰吾觀下界怨氣衝天大衆咸驚高眞兢愍卿之往彼吾則欽哉玄武於是奉命大帝倣元始玉音也按元洞玉曆紀至五帝末乃上天龍漢二劫下世洪水漸息人民始耕生靈方足衣食乃其殷紂主世淫心失道矯侮上天日造罪愆惡毒自横遂感六天魔王引諸鬼衆肆諸凶釁傷害無辜怨氣盤結上衝太霄靈寳道前衆聖高眞咸驚兢愍思念濟此業也衆睹太玄玄武至奉聖命元始上帝撫喻曰大道宜有付託吾欽之哉上遂賜金甲玄袍皁纛玄旗準敕降下方收魔也辭天回光反照披髮跣足降龜躡蛇太玄元帥秉水帝之符以清澄濁以正伏邪矣按應運經曰於後世值立魔成華崇綺致使惡道日增月盛是故衆眞哀愍衆生昏迷沉亂不見元始惟思邪流以棄正教太玄奉命解纏釋縛慧施萬物津梁一切普使見道名曰回光反照上元按降筆實録上帝命玄武曰卿可當披髮跣足躡踏龜蛇仙仗雷奔天丁翊衛俄於倐欻徧彼乾坤翦酷毒之妖魔捕恣橫之瘟疫幽魂生界苦病離痾人鬼分離寃家解脱黎民安泰國土清平啓聖記云魔鬼行營駐劄于東北徧野噩仙山間乃鬼道中也按降筆實録云太玄元帥與六天魔王戰於洞陰之野是時魔王以坎離二炁變爲蒼龜巨蛇化現方成元帥以神力攝歸于足下鎻鬼衆於酆都大洞人民始安宇宙清肅按太平經載眞君受元始符命神光寳書統領天丁收天關地軸二魔王忽一見如鼇蒼龜其形五變一現萬丈巨蛇其形三變眞君騰空歩乾踏斗化千丈大身揮魁𩲃之劍衝折二魔各斂形狀龜如拳五寸蛇如鞭三尺和合併體被眞君躡踏之謹顯二魔變相蒼龜一變色若金光甲縫蒼青二變色如碧玉甲縫含金三變色若蒼黄甲紋光青四變色如碧緑甲縫含銀五變龍首鼇身出紫金光甲間碧玉巨蛇初變狀若金色鱗如赤丹次變體現青碧色鱗絡金線䌔末變首如螭龍身色蒼黄鱗間金玉元始天尊說眞武經曰統領六丁六甲五雷八威齊到下方七日之中天下妖魔一時收斷人鬼分離寃家解散尚書載武王戊午日兵濟孟津甲子日大破朝歌亦七日克商誅紂平治社稷散鹿臺財發鉅橋粟天下黎民方得安泰於是國土清寧皆賴中天紫微令天官大帝遵敕暗宰其替否耶玄武再睹天尊具言道力功成事遂濁降清昇玄帝以義戰仁討事遂再朝玉清具奏元始却返祥光復還本位降筆録云玄帝凱還清都面朝金闕元始告曰卿在太初先天之前本北方五靈玄老太陰天一紫炁之化乃萬象之根今經二千五百年合還本方歸根復位於是元始乃命玉皇上帝頒降玉册拜北極右勝府事至是歲中元節日紫微殿宣示玉册誥寳也妙行因得聞紫元君授玄帝之法交乾布斗交乾布斗者玄帝本事也乃紫微館修經眞官當顯揚正教交乾者用日德之新也布斗者行中極之道也故德之與道則無思不伏按杜天師總龜集太上第二次遣玄夷蒼水使者下授禹王姒氏旣受之克勤于邦而盡力乎天下溝洫之事揚雄法言曰昔姒氏以治水土而巫者傚禹今之道術始名曰禹步也是故往聖之法非今之巫覡苟且詐踐之事乎輕舉尚招天罪其詳見經首奉祀儀範内激坤指罡上佐天關激坤指罡者一名躡地紀飛天綱之法也會造化生殺之權發天關轉運之機顯道導之施德得之是以大則廓清宇宙小則保庇兆民昔自中古禹王併受持遵教行之道能攝伏天下獰蛟猛獸魑魅妖魔及凶惡異類荼蠱諸毒驅斥出極外之地然後開導江河引之川流納歸于四海天下黎庶從此各安其居也激坤者乃躡地紀之法也當履順倒返三匝共得九跡乃結成元壇法席像坤道厚載之容我也謹當持念建壇神呪神之聽之罔不來格呪曰乾尊燿靈坤順内營二儀交泰六合利貞配天享地永寧肅清應感元皇上衣下裳震登艮興坎順離明巽主兑生虚歩龍驤天門地户人門鬼路衛我者誰昊天明主今日禹歩上應天罡鬼神賔服下辟不祥所求如願應時靈光急急如太上律令敕指罡者乃飛天綱之法也當立壇心以左右手掌循點指節至五斗罡位彈吹炁騰像璇璣華蓋之覆我也訣目以左手俱藏五指甲曰都天大法主印右手平持劍鋒各方念呪敕水噴之呪曰吾以月洗身以日鍊眞日月佐形二十八宿與吾合并千灾萬禍逐吾水清急急如太上律令敕誦呪至敕字揮劍鋒指東南高處以口收吸神霄玉清眞炁存口呷取盂中淨水噀之旣成壇席猶慮兇惡潜用穢污之蠹或饜誤法主衣物者准天條合行懲治標目洞天刀支地心刀支祛惡人刀支金刀支木刀支水刀支火刀支土刀支破寇賊刀支斷瘟鬼刀支斬蛟龍刀支降七魔誅二鬼刀支破五苦八難九横除百病刀支且如惡人來加害者當搯左手小指第三節主殺伏渠兇本人頗覺受殃也再搯右手小指第三節主其生放縱其去也名曰祛惡刀支目也别有經㫖兹不盡載蓋此實奥妙之階梯是元眞之門閥如有行持志士臨壇獲到一切兇異妖怪不祥之類如是哀盟宜恕一次不可妄意輕設此壇慢易誅戮鬼神恐墮法主陰德耳所註禹歩不敢施語當達者因化于未悟故舉之應諸初學姓名未曾拜師保奏入天籍者不可冒舉之也而作呪曰此呪乃玄帝本事大神呪也作是呪日在魔營上建九跡綱界上佐天關飛罩六合八紘掌握决勝乃持此呪一遍威令大行即就七日之間盡伏六天羣魔太初太易太初溟涬無有無名太易起初有一未形無象無形道本無象混合自然德本無形造立元根莫知重濁範圍未化莫知其矩重濁凝甚降積爲止孰辯輕清彌綸未分其規孰辯輕清高澄積陽成天吾於混沌玄帝介然果先天地於混沌時化象分瑞分其昏明虚危藹秀坎離眞精副除日月分其昏明天得以健天得一炁乾健昭回晶明焕列晝夜經緯地得以寧地得一炁坤順寧容固中至靜乃載無窮民得以養人倫抱一禀協沖和少私寡欲年劫乃多物得以萌萬物不匱因一發萌生端莫竭交應流行邪得以正邪陰衆雜其類異同太玄之一咸正宗風神得以靈神明得一變化自然靈通廓達洞照無邊三才之内天地統一元氣無形人達元識通徹内明萬類咸亨邦君得一萬姓咸亨昆蟲草木各遂其生大道旣散道先太極天地之根散爲萬物皆賴生成仁義乃興天德大德陰陽柔剛號今刑德起置行藏禮樂旣作三典五禮節約人倫樂制旣作九變示淳姦邪斯行外窮内衰棄禮離樂暴慢姦邪斯行苟作六義或失君臣混雜父子無序夫婦乖違六義失處四民有爭四業尊士次農工商各不專藝爭妬誇强上不寬恕帝紂亢暴道缺法圯不爲寬恕危國忘畿下不忠貞媚主崇虎嬖臣費伸刑增炮烙紊亂莫忠或魔或鬼罰有六疰妄出癘鬼兇從至處横禍不已或妖或精天灾地害現妖起氛百穀不成遺烈爲瘟恣横荼毒人兇恣橫餧茶逞欲埋蠱饜勝使人壽促干擾生民左道妖術移猖發祟干擾生民邀求非利全家染患陰謀切害交報赴刑身染惡稔全家患仍累歲刑名累年積月不遵仁義忠孝全虧陰譴陽治財物耗散無名財物潤屋豈乆一旦耗散子孫莫守骨肉伶仃天倫骨肉誰欲輕分伶仃有似禽鳥暫羣性命枉逝輕逝性命因自孽多一死之後墮落鬼魔灾禍相縈三灾六害豈枉相縈降罰臨爾罪惡貫盈穢雜之氣互傷物命肥口充腸豈知雜穢翳昩三光上達天庭劫運終際衆惡相刑七聲呪詛籲達天庭天尊有命元始慈造廣方便門乃命玄帝普救羣倫令吾安平玄帝准敕普福含生三元男女咸會安平有妖皆剪若有精妖非時發沴違其號令捕至當剪無鬼不烹無名鬼物輒敢崢嶸興殃邀祭獵至須烹瘟疫之吏八部五瘟司禁兇人無許縱毒横害良民束手服膺敢不遵者輒逞凶獰捉縛束手枷拷鞭膺鬼精滅爽廟貌神鬼輒肆猛烈停藏妖精一例勦滅邪魔摧傾魔守鬼職黨邪不應太玄兼知犯者摧傾吾有十億烈士太玄元帥統攝英雄雨師風伯電母雷公甲庚兩將八煞天罡六甲大神社令城隍五千萬兵太玄秉職都督諸營總管兵馬五千萬兵天上天下騰天倒地保護黎民典司内外降魔制神從吾降昇揮纛鼔從昇降不停保天佑地覃恩及人拒吾者滅有王衮拒玄帝聖訓而立見滅也衮登仕路酷食鼈鱔每任所决責吏從須索此物充饍衮妻子奉祀眞武香火常勸絶猒物衮不聽一日除駕部鎭邢州獨赴任所忽患苦心疼晝夜呻吟觸目無奈耳聞聲呼索命衆鼈鱔并來嚙身俄一披髮神人至仗劍叱退衮甦無恙知是眞武救護任滿還鄉寫道經一藏拾入延福宫答謝天曹遽蒙朝廷詔充國子司業衮乗舟赴京於汴岸遇一道士相曰公赴闕必拜修撰也恐加史閣檄充庚辛方幹宜辭免可不然則壽禄俱絶餓死雪中骸骨不收矣衮怒叱其相士忽失之衮至闕果賜御史天章閣待制奉命入西域因出言諷蕃君李萬全反遭耻辱國辭歸却畏本國刑典至界首誘從人奔羊山值天雨雪連綿壓于巖穴之下乆乏火食間見眞武垂空責曰衮爾於汴岸拒吾言今奈何歟衮方思之追悔何及漸幽囚餓死而滅奉吾者生如孫誠之信奉玄帝臨死地而復生誠之刑部員外借補翰林侍讀充奉使西域道過鳳翔路遇一布衣士謁之曰公莫奉使西蕃乎斯職非公命禄之權去必遭驚衆必受罪公欲度厄急須奉念吾師眞武名號當獲天年壽限矣吾昨亦承國恩今除仙職見掌三羅山玉峰瓊壺洞龍潭公事鍾進明也特來報公耳言訖忽不見誠之思惟直至西鄙入赴蕃君李希靜宴偶示一題曰日月出東還没西七字句誠之竟無可對蕃君怒令囚執縛之旣脱驚惶遭辱玷國及還朝廷刑加當誅誠之正迫懼間念眞武聖號數遍俄頃中書省門下白劄子趕至看詳孫誠之理合誅戮照得曾路遇神人鍾進明預言吉凶事顯是國家妄規重職聖㫖體此特賜免罪别降㫖下鳳翔府起建鍾進明祠堂塑身白衣儀相敕封善導安寂仙君之號永顯助國之美誠之信奉而得釋死重生惡吾者辱世多有無知等輩以惡觸玄帝者身口過犯招辱矣如梓州姦民馮蟲大高邵郎游行兒其三人結黨狎海鄉曲一日鬻卦魯遷家遭此三人於香火眞武前求籤辭意不吉便出詬語惡駡而去自後夔涪二州連强盜劫掠富家財物殺死命官楊助教捕吏無由敗獲時尚書刑部侍郎張世明爲安撫出給賞榜召諸色人告首於限節日忽遽聽前有魯遷告訴作過人是梓州馮蟲大高邵郎游行兒等同捕吏至梓州龍興寺側俱擒之押上夔府遷忽不見其盜獄具牒移關梓州唤上魯遷關賞遷不就供狀繳連云本家祖傳三世貨籤度日惟供養眞武雖是馮蟲大等曾到本家求籤辭不吉惡駡上聖而去遷實不曾離家告訴公事是的夔帥一見狀體量事情保奏于朝三司看詳若非眞武陰相又豈能敗獲累官害民之獗黨賞合給七分付魯遷作贖香資馮蟲大等所犯付市曹碎屍惡辱得豈不敬信乎報應甚速敬吾者榮如狄青之恭敬感玄帝降威附體助得身榮也青汾州西河人少隷鄉書手勤恪眞武香火寳元初年夜遇一神授黄金白衣乃聞陜西用兵志欲往禱眞武籤吉方行至延安府投中散直參經略範仲淹一見知是異材差充指使職事迎拒敵趙元昊二百萬寇兵累戰累勝戎將咸呼青曰北方天神將耶聲達招討韓琦之聽遂論列保奏狄青續承朝廷詔宣一行指使廖導等二十八名使臣赴闕日許披介胃木刀同詣嘉德廣鎭殿舞見跨馬陣列仁宗御覽其數内一人光煒上下馬前有龜蛇戲躣于地時參政宋庠方奏俄失光像聖㫖問狄青適列於何位青奏對稱㫖敕擢馬歩軍都指揮使仍討西鄙其趙元昊聞風納款請和之蠻寇儂智高發亂兩廣亦復克平詔除樞密判宣徽院天下兵馬鹽鐵公事享壽五十尸解追謚武襄公因生前敬奉眞聖身殁名顯禮吾者壽如吴元嗣信禮玄帝感一門皆壽也元嗣家第世居揚州江都白沙村務農葉爲生業每歲冬序祭饗三界答謝神祇恩佑偶遇泰州道士唐慶餘踵門縁化齋糧見吴宅用師巫鋪設天曹位號與凡神混列一例以血食犧牲供獻慶餘乃謂元嗣曰公不聞中天有眞武逐月下降糾察人間善惡功過事若憑師巫葷祀反觸上界恐求福獲禍耶元嗣一聞回心諦信再命道教重建章醮及設齋日有雲遊道衆二十餘人暫到赴會道士陳伯陽稽首迎問來歷内一人答曰吾知此地造析天會方從無間來赴之及筵散而去遺一皁袍於座位上光芒閃爍異香芬然元嗣跪禮捧藏自後聖節根括老人唯吴元嗣一門百歲以上者八人内吴琬百一十四歲歩履輕健俱臨御宴視聽皆不衰太守陳叔平詢及履踐因依具奏朝廷特賜吴琬一宫建旌表門閭顯其孝義禮而壽也非吾者薨世禄權臣不信非毁玄帝降言誠訓如評論爲虚誕之說者報昭惡疾而薨也如陳之翰佐僞閩王延政臣聞南唐烈祖李昇欲侵福建之地提兵已直臨邊忽然退師回班閩主聞奏涉疑特遣邵鏜持書過國通問其故南唐回書答曰孤昨躬提兵到邊境日見雲際神人隊仗迎揖與孤自稱曰吾乃閩山仙源都土地昨承恩主眞武遣令迎諫大王止可罷兵獲吉免使生靈陷諸塗炭且閩主世業未終至庚午化歸儷極況福建境土不當大王所有言訖其神辭退孤乃休兵故也醮答眞武拜章之夕明獲儷極之解乃周後火運宋主南面殿額也閩主覽及書畢乃會百官共議講和唯邵武軍節度使陳之翰諍諫不從擅遍王意曰國家大業豈憑陰空誕語誑惑遂上策永不與南唐講好請舉兵討之翰退朝至家無何下馬若狂自叫錯敗毁靈空之德俄頃失聲七竅迸血而惡薨也吾有此令玄帝立誓理治將來太玄科格無物不該人鬼咸聽人遵正道滅除罪愆鬼無害人脱謫升遷急急如太玄律令疾速回念依如告行太玄主一至神至精作用蒙泰練育華英律令統紀度拔衆生攝兼權三界須臾邇遐持惡録善止攝姦邪所註顯驗始以近世人事引而證諸並纂出啓聖奏章人皆頗知矣有遵不遵玄帝經呪訓銘誡勸格範者報應形于方册分明矣況玄帝誓人鬼咸聽之句以示生死兩途惡福之因事屬太玄天曹玄天大聖統領神仗同日月星斗之照雷電風雨之化甲庚日直將誥制人身中尸魄八節炁候神紏序人方寸善惡總諮訣北極帝命報應出右勝府司作善者降之百祥慶流後代子孫爲不善者降之百殃遺烈衰絶嗣續雖未見伐愚者妄以爲幸免一旦禍期將至其惡趣無不歷尚玄帝慈愍猶賜解釋啓聖記曰凡有宅舍每被古墓喬林孤魂滯魄應干等物歲乆成精依草附木滴血放火抛石擊門與夫山河社廟之神或結集精藍私立香火及師巫座席去處互興妖孽橫求人家祭祀欺惱衰敗應黎民有此邪祟干犯者莫非崇敬眞武香火即獲正眞永鎭羣魔而納嘉祥門庭清淨矣爾時妙行眞人爾時者謂說如是一段本傳因縁畢也妙行眞人因修地本多行提拔開示未悟引進學人虚皇天尊曰子未生時混混沌沌本無一物視聽不得與眞常會無有明相孰爲妙行又曰精心苦行絶世所欲不興妄想無有著以氣鍊神以神鍊形形神俱妙體入自然斂萬法歸於一身散一身而化萬景不滯有無永絶生滅是名眞人無量飛天神玉無量說者乃飛天騎吏一時隨侍赴會莫得較其數目也飛天神王者五老帝君受任主職也飛天下觀晝夜無閑生神章曰總括天仙雍和萬化撫料蒼生眞仙大衆靈寳定觀經曰延數千歲名曰仙人正陽眞人曰仙遷五種鬼仙人仙地仙神仙天仙楞嚴經曰修仙有十一曰地行仙二曰飛行仙三曰遊行仙四曰空行仙五曰天行仙六曰通行仙七曰照行仙八曰道行仙九曰精行仙十曰絶行仙大抵於道有功爲人有行功行滿足超居洞天便得效職列爲仙官若又於天地有大功於古今有大行從此漸進仙階昇擢歷任三十六洞天及於八十一陽天超入虚無自然之境名曰眞仙聞是說已踴躍作禮讚歡功德祕録琅函紫微大帝談演洎終則星眞仙曹咸皆跪辭起而同聲頌玄帝功德之美想惟巨録琅函封進太清太極宫中遵依玄科四萬劫一傳於下土至人奉行乆矣大帝復證此經則曰太上必授於謫仙傳於人世耶果賜漢張徵士流行也後有謫仙傳於人世勵生譴殺太上之意也後有者自中古以來是也夫謫仙者謂獲上帝所譴眞士也遭罰留形墮于凡世再蒙上帝特赦然後輕舉矣姑陳一二張天師因殺鬼過酷謫留十年西晋許眞君不祭祖先犯貪殺逆罪譴留一紀漢天師家傳云質帝本初元年丙戌歲眞人欲徧經治山徙閬州雲臺山築室纔居四十九日忽聞空際天樂嘹喨端簡瞻禮見是太上老君導從徘徊久之不下俄一吏傳命曰道陵據子之功業合充九眞上仙之位縁爲汝入蜀收鬼幽獄不合擅興風雨驅馳星斗役使神祇震蕩山川殺氣翳空非好生之德上帝敕譴汝且留凡塵故太上今不肯近汝眞人悚聽又承一使者呼道陵曰敕命下元主者雪汝罪戾矣特賜汝三八謝罪滅黑簿超度玄祖靈文眞人拜受聖駕方興眞人再回居鶴鳴山南斗經曰太上第三度降臨荐授經籍千軸皆修行之要道將傳付有道者令生身受度使永劫長存於桓帝永壽二年眞人將諸品經籙印信並付長子衡囑曰仰後世世一子紹吾之位非吾家宗親子孫勿傳衡承襲畢三年内至九月眞人復往雲臺山九日停午上昇矣衡於靈帝光和二年己未歲隱居彭州陽平山傳法授之長子魯魯徙漢中南鄭城居至獻帝乙未歲魏公曹操兵克城弟張衛遭戮魯降辭不受裂地之封於建安末年以祖法付長子滋無嗣弟盛携子昭成南游江東吴孫權之境至上饒郡登龍山之巓見祖眞人遺風丹穴井竈尚存遂結廬於麓居焉歲丁巳聞魏明帝睿已破蜀祖眞人家藏遭焚昭成奮形還蜀承接伯父滋法位而歸於孫皓甘露元年甲子歲建正一玄壇于居址之處將祖傳諸品祕法符籙傳度四方開度學者於品籙階内有玄天眞武無上將軍祕籙從人參請也志道之士稽首奉行志道之士謂果能奉行互相勸勉見聞者是也按此經之風教乃先倫化君臣父子夫婦兄弟朋友之五等效心盡信而無虧理者得自然心淨神爽洞曉蒙泰二卦之宗趣功德昭著者多矣此實常明之教法豈得有淪滅哉雖然遭焚於魏及蕩散於西晋則必有隱眞之士口口相傳翻爲數本則各自有授受總說眞武之因其義則大同小異也今並行於世間目曰玉筍傳西晋惠帝元康年間道士黄輔眞君傳出北斗眞武經東晋成帝咸和年間道士季文華受紫虚元君所傳紫光經出清虚洞王眞君傳太平經天師寇謙之回授北魏太武帝紫微神呪靈寳大有自然神兵護國消魔品眞武經見唐玄宗時有蘇眞人傳中出也經云老君於上皇二年三月八日在紫微上宫說虚危二宿託精應變聖父玄母始姓三炁結成大塊至建申之月坼卵分形長五百丈眞武因地經抱朴子太極眞人口傳㫖意類本傳經訛處說虚危二宿託精於廣靈宫化爲大塊建申之月上七日卵坼之事頗涉疑且曰不知誰爲父母者也莊子曰寓言十七巵言日出之謂歟且夫天文位乎上人文位乎中不可得而增損者自然之文可以化人也玄天大聖眞武本傳神呪妙經乃漢天師張道陵親遇太上老君下授經籍之本玉虚師相眞武實録大羅天上清七寳紫微宫天機都承㫖神應惠元董眞君編降授道士張明道眞君曰玄帝玉册乃上天秘書非中下二界所聞今於玄都請録下命實録序金闕昊山檢校洞上仙元皇純一張眞人序曰太古先天之書不降中下二界祕於紫微上宫玄都之府萬劫一傳豈率易可知哉是以玄帝事跡在先天之前莫得知其涯際而中界眞宰欲談者皆杜口難窮深以拳拳況下土士民焉可道聽而途說今非上卿凝神藥簡洞達祕書岀於自然自得之學焉使普天率土昭知玄奥如是則果知仲尼釋迦上卿不待宗師自得至妙乃可究其廣博旣聞實録頒降名山刊諸簡册不敢默觀自拃謹熏香成序以紀其先謹序价夙生多幸值昌流布續集以上天祕書如是則不無分别姑列則不滅照心也請誦持者隨其所受功德俱不可思議並感虚危内篆助其圓成水火精神降臨昭著不惟玉簡題名太清有分更生而必能福之矣太上說玄天大聖眞武本傳神呪妙經卷之六
