front:
  text: 太上說玄天大聖眞武本傳神呪妙經卷之三
  hash: sha256:13ff2a03cfe0cd836b58d85ab69cea23265c0b82ea153469642dc6d76f4f198d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0150_SJB_003-170111c, image: sjb/17/170111c.png}
body:
  text: 鄽人方田子佩昇玄内教籙陳伀集疏是時眞人再拜稽首曰臣之慶幸荷此綸辭妙行稱讚紫微敷演乃經綸端緒之教然其玄武之將軍乃玄元之應化其始之迹其事云何願賜詳言以開蒙鄙蒙者不智也鄙者不慧也故妙行謙和宣明開析玄武詳節普使會衆咸聞靈因亦願三界人天盡知玄武妙紀深趣之㫖要也於是紫微大帝敷以玄言釋彼所因解無上事昔大羅境上無慾天宫淨樂國王夫淨樂國君能聖哲主務而感生玄帝繼踵於考命終日得乗生前所種清信功力命超無慾天宫衣飯天之厨箱受諸快樂自然虚皇經曰人有千善福及七祖死魂爲仙萬善旣備玉符下迎千神來朝白日登晨玄帝修眞果效奉天詔曰九五老天君降言曰子之聖父聖母已在九霄矣九霄境乃玉虚無色界中列三十六天宫總隸大羅三境玄帝父母得居龍變梵度天無慾宫中按紫光經云淨樂國境乃海外仙國在西域月支國之西星分奎婁二宿之下善勝皇后夢而吞日覺乃懷孕其母氣不納邪日常行道旣經一十四月乃及四百餘辰於開皇元年甲午之歲三月三日午時降誕於玉宫相貌殊倫後旣長成遂捨家辭父母按降筆實録云玄帝降誕時正當上天開皇初劫乃下世黄帝紫雲元年歲在甲午戊辰月初三甲寅日庚午時符太陽之精託胎化生産母左脇當生之時瑞雲覆國異香芬然土地皆變金玉瑞應之祥兹不盡載立小字曰安于生而神靈舉措隱顯年及七歲經典一覽悉皆默會仰觀俯察靡所不通潜心念道志契太虚願事上帝普福兆民於是父王不願抑志年十五再辭王許賜道號曰潜雲子按實録云太上賜玄帝李姓蓋取宗化之源按西域國西州天山壇降筆載聖父玉諱告姑沃切玄帝玉諱乞按啓聖記玄帝應化唐時裴姓諱仲芳按本生經祖諱牛孳宗諱端受右暗諱四字賊瞎言乗凡對聖席語宜令勿犯上諸玉諱本經内有言乗二字可密音默誦之以當回避也如獻欸投詞祈求所欲者於玄帝疏内無得書犯諸諱字諸兩字諱者不許聯用如是單用一字書令字不完入武當山修道四十二年功成果滿白日昇天玉皇有詔封爲太玄鎭於北方顯迹之因自此始也武當者古名太和山按九五經緯天地曆曰禹平水土之後分治九州拜立五嶽定封四瀆範圍厚載之德名山大川悉以神聖主之乃考翼軫之下有山曰太和故老相傳云上古玄武得道飛昇之地更太和之名就封曰武當山按實録云王子離宫尋訪幽谷遂感玉清聖祖紫元君授無極上道元君曰子可越海東歷於翼軫之下有山自乾兑起迹盤旋五萬里水出震宫自有太極之時便生是山上應顯定極風太安皇崖二天之下子可入是山擇衆峰之中冲高紫霄者居之當契太和升舉後二千五百歲龍漢四劫中當披髮跣足攝坎離眞精歸根復位上爲三境輔臣下作十方大聖方得顯名億劫與天地日月齊并是其果滿也語畢元君升雲而去王子乃依師語越海東果見師告之山山水藏没有七十二峰一岑聳翠上凌紫霄下有一岩當陽虚寂於是採師之誡目山曰太和山峰曰紫霄峰岩曰紫霄岩因卜居焉潜虚玄一默會萬眞四十二年大得上道至黄帝紫雲五十七年歲次庚寅九月丙戌初九丙寅日自清晨有祥雲天花似雨而下迷漫山谷去山四方林巒震響自作歩虚仙樂之音王子拱手立于紫霄峰上須臾雲散見五眞羣仙導從甚盛非凡見聞悉皆降集王子稽首祇奉拜迎五眞曰吾等乃九五老天君准奉三清玉帝詔命與子啓途日當午五眞宣詔王子再拜稽首興受詔領賜品儀易服訖乃歛圭奉乗飛雲玉輅羽蓋瓊輪上昇朝赴九清境矣夫玉皇有詔者是斯經内一百六十八字天書篆文也承此赴除太玄之職方始顯迹於凡知有所修之因也眞人稽首再拜白紫微大帝曰玉皇詔封必有妙㫖敢問大略以開小聰爾時告於妙行曰天書祕密何可談揚恐泄天機深爲不便大梵隱語奚使衆聞北極中天紫微令事遵佐金闕昊天發敕讚勞褒勉約束論事而已時依應三清玉帝璽書頒降准事施行畢謄祕于紫館況明眞有格未易冒禁露談寳訓恐致輕泄之愆也於時妙行開存衆之誠請問大帝㫖意之故謙謙然寳惜特爲遏衆信結誓立盟使夫理志合儀者矣妙行眞人拜手稽首復奏言曰臣雖縁薄聖必恩寬曲念衆眞特垂大便苟輕泄慢當墮惡途萬劫千生長爲下鬼六趣雜染輪回總號惡途應是冥官幽吏皆曰下鬼是時紫微大帝念此眞人著意勤拳再三請問遂宣帝敕以示衆眞拜手者執簡啓壇禮跪也稽首者俛首至地俯伏也三請者則九拜手三三俛興也妙行慇懃奏請遂乃設誓雖縁淺薄不敢口敬心違違者甘當處下鬼之趣勤拳爲衆三請蒙大帝敕㫖遣給事侍中啓琅函玉匣出示玄武飛升天詔宣唱也夫此祕言金書篆字大方一丈號曰天符見之者永處天仙聆之者不歷地獄言夫此祕者顯昊極三天門下金闕誥命璽封奬其天符尊崇也按實録云符篆詔製乃天眞皇人撰及書也字大方一丈者則八角飛芒各一尺篆跡也曰赤書玉字之體以金錯成形也得永處天仙是斯會無極仙曹咸獲瞻見當增其品秩矣次聆聽者因東漢之季太上降蜀授徵士張眞人道陵玄武之經使流傳于世張君乃以金篆詔書文義易作凡間書體浹濟學道之人使夫誦念及聆之者保毓腎官太玄之氣堅固耳宅門户之聰使地司黑簿無得書執曾歷八百功德之人也是等學人命終之際死魂不當墮入地府獄中按天師杜光庭集道炁初布混漠無形炁凝於浩莽之間文結於太空之内曲折成字八角飛芒元始命天眞皇人象形摹寫名曰天書玉篆乃爲文字之祖體也其詔文曰此經天符詔語乃依降筆實録本書金闕昊天三省門下牒奉敕學仙聖童淨樂王了七歲神靈淨樂國子十五志道辟國二親惟卿玄元之化太虚本炁玄元化生天一之尊太陰天一紫皇尊身不言而教守中忘言授學元君莫知其神莫知帝象惟德至神渺渺劫仞善釋魔刃歷劫解紛綿綿若存鎭護元氣綿綿長存虚心實腹清心寡慾抱一順眞和光同塵守昧同垢韜光晦明鑿開造化𨯳𨴋虚已鎔化至精樸散胚渾雕琢覆樸塊然胚渾六百萬歲延康劫初紀至庚寅八十二身五靈老始玄武後形曲今枉直詘己證道舉衆伸人窪盈幣新若水下物度幣革新生陰育陽陰生陽育女癸男壬起死成人恐人天橫衛生留經其功不恃興益利施亡執恃名其德乃眞不希上德眞靜常清今宜再顯吴天宜命太玄悖與永鎭北旻秉斯公治專政愍民上罰逆象祅精逆象輒現與擒下滅妖氛邪氛侵氣妄逞收平掌握圖籙掌握宇宙極圖誓盟攝制魔蹤鎭伏魔勞大刑攝擯帝真灵会帝真生理鑿術宏巨驅神駕龍駕龍馭駿統七號兵甲庚之將特紀綱賜驂甲轡庚贊衛爾動克成贊術蓋署元勲周環六合十一分野按月日巡普福兆民分身下降普福乾坤道參天地大道參校可詔飛升萬眞所推九清萬眞齊賀帝庭可特拜太玄元帥領元和遷校府公事册到奉行紫微乃言告眞人曰此文者玉皇祕敕天帝徽宣不可輕傳恐遭降責紫微大帝所寳三宣初敕曰天書秘密何可談揚恐泄天機也次曰玉皇祕敕不可輕傳恐遭降責也末曰非乃至人祕之宜也誡授受者恐口敬心違也因縁經曰凡人現世長命富貴者往世曾敬信大道妙義中來永劫家勢不衰者曾延奉正眞及成就功德中來處世爲人才識明了深通妙理達性眞者曾持寳經不妄傳人中來也眞人稽首又白帝言臣聞玄武將軍神通至大不居諸位而鎭北方妙用之因神明之契必有奥㫖願釋鄙懹妙行復問玄武洞妙因何專政位居北方大帝遺音告眞人曰天中北上衆曜拱之以匪至神孰能鎭遏中天北極之中建紫微帝庭也元和遷校府署乃毗紫庭之北且玄帝偉政位天官四帥之右導森羅萬象之前故經曰衆曜拱之職事准玄帝功業可當也每羣眞會朝昊天至尊則四聖爲都班之首實録云元始陞玉宸殿内大會諸天上帝校遷三界羣眞登命九天司馬侍仙玉郎啓太丹玉匣出萬天素威功過玉曆敕金闕侍中司馬大神韓君丈人金闕司命可韓眞人金闕司録定名玉曆眞人金闕司功九天採訪眞君金闕司過九天儲福眞君並開曆考績三官四聖之職自太虚開化神一挺生有保天佑地化育之功奏上三清乃命玉帝親行典儀當亞帝眞之號遂詔玄武詣闕登七寳瓊臺之上遣金闕侍中素靈殿大學士三天門下直日儲靈典奏事金眞紫陽大夫含光上德仙君軒轅執本齎捧昊極三天門下玉册傳命宣賜玄武儀錫以通天十二旒冠玄衮上施日月山龍物象玄玉寳圭紅舄玄履瓊旌寳節九龍玉輦玄武拜受易服訖仙君謹言玉宸三省誥曰皇皇大道赫赫至眞太極開判玄元化生妙藴樞機萬天尊仰則爲聖明主務其休隆廣焉敢不崇欽惟太玄元帥鎭大玄武大將軍三元都總管九天遊奕使左天罡北極右垣三界大都督依前領元和遷校府職判玄都右勝府公事太上紫皇天一眞人册曰靈通太妙上開混化之玄道備鬰明下統虚危之秀寳育天元撫成地紀持造化於四時推紀綱於八節分身下降普福乾坤功齊五千萬劫德並三十二天九霄上賴於眞威十極仰依於神化有大利施於下民積聖德徧於玉曆按遵簡籙當亞帝眞敢不徽崇何以明德賜尊號特拜玉虚師相玄天上帝領九天採訪使金書册寳曰夫道生一炁感化三才結眞于九極之華晨麗于六天之秀幽微煒燁洞杳飛芒功高難極合示嘉尊想惟鑒觀幸勿謙辭餘當上輔大道劫劫長存下佑兆民綿綿永祉龍文昭降永祕玄都謹言崇封聖父曰淨樂天君明眞大帝聖母曰善勝太后瓊眞上仙下蔭天關曰太玄火精含陰將軍赤靈尊神地軸曰太玄水精育陽將軍黑靈尊神並居天一眞慶宫仰觀玄帝之勳業在于今日之權總司三界功過事況眞休尚賴其威輔而神通果至大歟眞人乃啓於紫微若有天人志心欽仰其於福利有所得乎妙行眞人思正萬彙順天人之心仍問欽敬福利將化人天歸向耶大帝曰此神將是歲每月六日十六日二十六日諸天審察此諸天者乃是色慾一界天境公事玄帝之守巡歷審察二曜三辰五行萬象星府事彈鎭不正妖彗也故本經曰每月三度統領神兵躬往諸天徧爲巡察凡遇邪氣及有妖星速須剪戮是斯職也色界天屬上元三炁君召諸天人眷屬事中外一十八天主尊謹著叡號中九天五炁天君主北方元靈上極天始素天君主西南妙靈寳華天九炁天君主東方玉華無極天始丹天君主東南大虚眞極天一炁天君主上方玉清虚皇天始玄天君主西北素靈皓元天七炁天君主西方玉靈素華天始青天君主東北太靈眞元天三炁天君主南方南極玉文天外九天智德天尊主北方雙闕化身天威範天尊主西南至妙變空天仁愛天尊主東方元眞寳曜天慈和天尊主東南開靈傳道天載德天尊主下方中極總生天成化天尊主西北元關溥濟天義議天尊主西方成德曜晶天智積天尊主東北暉明流光天禮教天尊主南方太平運化天色界乃無五行之所其中天人眷屬衣飯天之厨箱也本因是從凡修鍊之士而及之靈寳經註云人有百善東華註名以至三百善去身業歷淨行命終蛻殻神隨功著飛舄此境也於中增修及千善者福延七祖神魂靈魄聚爲眷屬也慾界天屬中元三炁君召諸天眷也其六天十境最居下位接人間頂題名于后諸天叡號善勝天王尊北境他化自在天妙化天王尊東境樂變化天妙德天王尊中境兜率陀天清淨天王尊南境須燄摩天靈和天王尊西境忉利天淳和天王尊護世四王天中央東方境主持國天王南方境主增長天王西方境主廣日天王北方境主多聞天王靈寳經云人有十善司命儲筭至五十善五帝友别三業漸除形神少忘得返五行之妙天命終際神魂徑超此諸天境受大快樂也況夫玄帝禀命常保育天元矣十洞巡遊十洞者乃十大洞天也巡遊警察神仙公事也按朝天懺應洞天所各立仙官曹僚分掌攢集萬彙籙籍功過等事及正月七日二月八日三月九日四月四日五月五日六月七日七月七日八月十三日九月九日十月二十一日十一月七日十二月二十七日下降人間剪滅邪魔驅除瘟瘧保人慶壽以全天命其有氣正心純忠全孝盡名書玉簡保舉昇仙更有玄科莫可併述眞人稽首再拜白紫微大帝曰顯化之因則聞命矣天人欽仰玄武將軍作何歸依設何方便而得福利幸賜一言妙行請問歸依之人設何供禮大帝是時告眞人曰天地之内能有至心奉祀玄武一生之内不食鯹音星羶自斃毒傷穢之物及於蕌音小菜大蒜葫荽躭婬嗜慾扶屍接産若能斷得方可志心凡臨下降之辰皆有禎祥之慶大帝語天地之内者謂天下地上大千世界中人也能有志心奉祀玄武者勤修香火之家誠謹信奉遵依此經避忌之人實於衛生利益按應運經曰飲食隨縁不必勞神不必著見飲則通其色身血肉食則充其色身臟氣按靈寳大誡經身中元神惟務清淨不可雜食臭腥臭腥之物壅滯經源纏羅六腑又脂葷辛臊昏塞神門攻蒸五臟生諸病惱人不能知形神豈久可聽此經保人天年以除灾患此乃簡要之法所宜遵戒也腥羶者黿鼉龜鼈蛇鱔黑鯉魚曰臭腥食也牛馬野獸肉曰羶自斃毒傷自斃者乃活動物命無故死也毒傷謂猛獸攫擒食之遺剩自死及彫殘食之多命促此之謂也按孫眞人食誡曰猒穢物者鴈肉猒犬肉穢藟菜乃小蒜也食多耗散精神也大蒜雖入藥久服反閉塞神氣葫荽其臭透人肌膚令人多忘芸薹韭薤已上總葷菜也躭婬者竭精虧腎玄武逝後嗜慾者敗氣散神朱雀棄前扶屍者死魘驚魂青龍離左接産者血腥衝魄白虎亡右或誤食忌物當念本經淨身神呪則穢雜之氣出雜於身内矣唯扶父母師資死屍候葬畢日外更吉服而可朝眞謁聖也易繫辭曰天之所助者順也人之所敬者信也信者誠心晨昏上香朝扣玉虚之門志感太玄眞人按旄部録所循之善申明右勝府事必降禎祥之慶光輝子之門闌漸進則天佑之也其夜聖降之期預先一夜也先當澡瀹身心不汨思慮先當澡瀹可預除身垢孔子曰沐浴爲齋潔也非爲飾也不汨思慮者却去胸中亂事太上曰澄其心而神自清又曰形神俱妙與道合眞至五更躬然香燭淨果棗湯香通眞達誠唯降眞沉香可燭貴黄蠟者輝明祭祀淨果五果忌獻石榴李子棗湯沸湯瀑日曬乾棗尹喜内傳曰神仙多以棗宴賔也淨水亦佳設淨水因昔唐追封太上老君爲祖也憲宗幸廣平苑夜坐于軒睹眞武降現威容立于雲際帝炷香躬問奉祀天曹儀範眞武降言𤑔香者可達誠誠非香則不能達于穹蒼也酌水者能滌穢炁一切清淨皆由此生故供養不可無水也語畢帝謝眞武昇天矣乃元和元年八月初八夜半降唐禁中故事也觀此豈上聖所欲哉我當表誠遵此位列有三志純于一位列有三者遞歲三月三日玄帝宴聖父聖母於瑶池玉洞天報答誕生之辰香一炷燭二枝淨果棗湯當設三位分志純于一者餘諸降日只用設一位分香燭果湯稽首禱告無願不從凡禱正念者上聖無不從人所請啓聖記云宋朝仁宗皇帝因轗軻問詔命道士洞神法師王伯初庭對休咎事於登壇日燒化御封心詞俯伏出神齎表達上穹翌日敷奏臣伯初昨趨昊極奏對罷朝迴至西天門葛將軍見報曰眞武已保明蒙玉帝御筆敕㫖賜延聖壽一紀帝悅賜御筆璽記贈眞武銜嘉祐二年正月日敕準寳應閣長生玄都殿賜銜也謹鋟于后降眞讚曰萬物之祖盛德可委精貫玄天靈光有煒興益之宗保合大同香火瞻敬五福攸從詔書伏以靈天肅正俯降塵寰通明護國定亂殊聖現前感應施惠救民顯照圓成所禱悉從是願所求皆有證心不但國王大臣道僧士庶一切有情能恭香火普及所意無不果遂以斯福善住世專事濟人承恩者庶廣不可思議今旣獲于聖佑於國於家豈擅忘於大道延福增齡永祈保祚除已行恩天下啓聖奏章一百四件並係功成正化謹就玉津園建其聖堂報答天鑑得蒙現足垂靈仍賜爲社稷家神崇遵眞武上聖宜可授玄初鼎運上清三元都部署九天遊奕大將軍左天罡北極右垣鎭天眞武靈應眞君奉先正化寂照圓明莊嚴寳淨齊天護國安民長生感應福神智德孝睿文武定亂聖功慈惠天侯右准敕宜令祀授龜蛇贈封施行其龜蛇二聖銜注在本經前祛妖攝毒之句下也然乃靜思虔誠誦其神呪然者道指也靜思處靖廬坐也虔者慤誠者信誦者念其者斯神者神明叩齒誦呪呪者蓋以聲發禦邪虚皇經曰身垢不淨以世水洗之心垢不淨以法語洗之或自首罪亦自洗也北方玄天杳杳神君億千變化玄武靈眞騰天倒地驅雷奔雲隊仗千萬掃蕩妖氛雷公侍從玉女將軍鬼神降伏龍虎潜奔威鎭五嶽萬靈咸遵鳴鍾擊鼓遊行乾坤收捕逆鬼摧斬魔羣除邪輔正道炁常臻急急如元始上帝律令按紫光經云此神呪出神寳君祕書也太陰化生水位之精虚危上應龜蛇合形盤遊九地統攝萬靈無幽不察無願不成劫終劫始剪伐魔精救護羣品家國咸寧數中末甲妖氣流行上帝有敕吾故降靈藏揚正教蕩邪辟兵化洽黎兆協贊中興敢有小鬼欲來現形吾目一視五嶽摧傾急急如太玄律令敕按行道品經三洞大法九品第九曰神呪能驅除疫癘掃蕩妖氛蠲却精邪最爲第一也太上說玄天大聖眞武本傳神况妙經卷之三
