front:
  text: 太上說玄天大聖眞武本傳神呪妙經卷之五
  hash: sha256:cda187329835f358003a8e6b06ea344ab6d2ef44d8b3de7224d29bd9c18e9c48
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0150_HFL_005-001a, image: hfl/0531/0531-042.png}
body:
  text: 鄽人方田子佩昇玄内教籙陳伀集疏眞人曰妙用之理可得聞行又審玄帝妙用至理不可思議處而爲諸大衆眞請示功因也大帝曰昔永壽元年上元之日昔者言往時事因也北極中天紫微大帝於上元日陪從元始御駕八景聽法是日上命遣將殄魔至中元日昊極詔下就紫微殿陛册封勞勳矣永壽龍漢乃上天中天年號上元中元二節日其實則一年中事矣元始天尊於八景天宫向五雲座上於者是幸居也向者乃陞對也于時元始大天帝駕離玉清聖境所幸東北大霄遣五老天君特命召諸天上帝赴是闕聽演度人經道言昔於始青天中碧落空歌大浮黎土受元始度人無量上品夫始青八景泛太靈洞華三陽九眞太一之炁結成五色瑞雲師子玄座元始登此座也與三十六天上帝與者善待也是時昊天玉皇上帝總領先上中天三帝洎四方三十二天上帝並詣丹墀各各嚴肅整班朝禮度人經載元始天尊當說是經周迴十過以召十方始當詣座東方八天太皇黄曾天帝太明玉完天帝清明何童天帝玄胎乎育天帝元明文舉天帝上明七曜摩夷天帝虚無越行天帝太極濛翳天帝南方八天赤眀和陽天帝玄明恭華天帝曜眀宗飄天帝竺落皇笳天帝虚明堂曜天帝觀明端靖天帝玄明恭慶天帝太焕極瑶天帝西方八天元載孔昇天帝太安皇崖天帝顯定極風天帝始皇孝芒天帝太皇翁重浮容天帝無思江由天帝上揲阮樂天帝無極曇誓天帝北方八天皓庭霄度天帝淵通元洞天帝太文翰寵妙成天帝太素秀樂禁上天帝太虚無上常融天帝太釋玉隆騰勝天帝龍變梵度天帝太極平育賈奕天帝中央四天昊天金闕玉皇上帝先天聖祖長生大帝上天紫微天皇大帝中天北極紫微大帝七十二福地眞人宰玄壇仙官也按度人經云元始符命時刻昇遷諸仙職者每發眞念以利世人也分掌山川之間秉録籍上朝則贊眞度仙是諸眞官旋行典儀惟地肺福地眞人爲班長統衆朝現地肺山福地眞人蓋竹山福地眞人清遠山福地眞人安山福地眞人石磕山福地眞人東仙源福地眞人青嶼山福地眞人郁木坑福地眞人赤水山福地眞人丹霞洞福地眞人君山福地眞人桂源福地眞人靈墟福地眞人沃州福地眞人天姥岑福地眞人若耶溪福地眞人金庭山福地眞人馬嶺山福地眞人鵝羊山福地眞人洞眞墟福地眞人清玉壇福地眞人天光壇福地眞人洞宫福地眞人陶山福地眞人洞靈源福地眞人三皇井福地眞人爛柯山福地眞人勒溪福地眞人龍虎山福地眞人靈山福地眞人泉源福地眞人逍遥山福地眞人閤皁山福地眞人始豐山福地眞人金精山福地眞人東白源福地眞人鉢池山福地眞人論山福地眞人毛公壇福地眞人雞籠山福地眞人桐柏山福地眞人平都山福地眞人緑蘿山福地眞人彰觀山福地眞人抱福山福地眞人大面山福地眞人虎溪福地眞人辰山福地眞人馬跡山福地眞人德山福地眞人藍水福地眞人玉峰福地眞人天目山福地眞人商山福地眞人張公洞福地眞人魚湖洞福地眞人中條山福地眞人司馬海福地眞人綿竹山福地眞人甘山福地眞人隗山福地眞人金城山福地眞人雲山福地眞人武當山福地眞人太和山福地眞人女几山福地眞人少室山福地眞人廬山福地眞人西山源福地眞人南田山福地眞人抱犢山福地眞人惟諸天上帝皆永臨天位也應諸福地眞人各聽玉帝輪排差除職任也考續治政行事得失仍聽升退者也無量飛天大神無極長生大聖金童玉女九鳳八鸞侍衛於輝光羅列於左右無者不可也量者度也極者至也謂不可度侍從中數矣且諸天闕庭下陪駕侍御職事曹僚局司威儀濟濟矣飛天大神乃從輦策駕之官掌儀鑾法物等事按大戒經云昔人能通戒行精進不退轉者即與證明作清信之士果滿命終特補充天中勇猛飛天大神長生大聖者乃三省總轄之臣紀三界進修功籍按玉晨藏筌云下元學人輪迴疾疫若心離塵昩種種堅固神通慧極法光神光慧光沖霄而入眞常之道天仙拜迎帝命入宫補儲天官之位主理生籍金童者安鄉亭侯之職如凡世給事中丞按漢天師家傳云子房子淵並佐太清宫童子侍奉老君玉女者應傳命儀淑之品如凡國嬪御命女之類也按混元經又以玄炁結成雲閣吹嘘感召靈符化光金童玉女執節持幢鳳鸞乃靈禽也出自南海丹穴女沭二山中九鳳者九隻爲一成號九鳳祇應三清合九九八十一隻動成九韶應玉清上清太清之樂八鸞者八隻爲一列號八鸞八八六十四隻列八脩之舞協洞眞洞玄洞神之範二禽形高八九尺身羽彩發光輝曲終舞罷環列諸天侍衛左右八音自響衆聖咸欣八音者謂八卦形器之韻自響者因靈風鼓瑟騫林發聲唯三境九霄有無量自鳴天樂之妙出于琳琅寳樹枝葉之間皆自合宫商節奏妙泛石磬軋玉之響妙泛鼔鼗坎革之音妙泛笙簧艮匏之韻妙泛簫笛震竹中聲妙泛柷敔巽木之擊妙泛琴瑟離絲之鳴妙泛壎𪛊坤土之調妙泛饒鈸兑金鍠錚靈寳經曰瓊府巍峨境森扶藹華騫靈風泛洞響可保無窮年蓋此妙樂嘹喨自然之音最能利益於聆者使正性全眞也是會莫不咸欣其美哉嚴聽天尊說至眞之妙法嚴聽者大衆悚聞談演也夫至眞妙法乃是洞玄中乗開度天中九眞之祕典也此教總一十二部秩目曰第一靈和部第二靈寳部第三通神部第四無量部第五集仙部第六内祕部第七至眞部第八進善部第九鍊精部第十生户部第十一官圖部第十二銷魔部已上部目共計八萬四千卷元始並授玉晨大道君永祕玄都玉京天臺之内也洎三十六天中其文具足矣於是名山洞府海嶽仙官雖有所修者唯但聞篇目豈獲斯乗足備耶況下土士民探賾乎今降流于世者乃出第二秩靈寳開圖之妙經也應運經載西域老曰大底衆妙不過一門若夫世人内應陰之運度外體陽之剛柔推以五常授之一炁於此門中知其漸處乃得神炁降息神巳降息百魔潜傾是爲靈法諸炁皆平炁平而息四大一清此爲鍊化而爲大寳也肅清道炁繞無上之玄元肅清者乃謂至道嚴淨之炁也故澄清開光結爲神化之主洞訣流貫上通上清下兼洞神乃謂繞無上玄元也按靈寳開圖經載元始以靈寳祖炁交始青之炁主御天地鬼神滋榮世間生炁抱魂結鍊營護太和浹下元生人耶于時元始乃命天眞皇人紫筆圖記將恢大教慈惠流芳而接學人也按西域老曰上玄下微應運璿璣華房都領炁紫宫集神威此乃謂歸眞之要道透玄之户牖若太上士初登靈寳始扣玄宗須引而導之此法應機當求復捨方妙理之研精方者謂靈寳妙理方法也元始天尊爲衆開擴微詮萬聖皆得研究精極左仙翁釋靈寳誥法靈寳本炁始一混然太虚源流昇降諸天致靈洞渺輔翼衆仙飛祥鬱秀度品惠圓以神降集乃法道先以炁停息乃合自然俄天門之東北祖炁開化九霄之境列三十六天也上極無上曰大羅三境之天乃都天也都天東北門之間乃號曰太霄八景始青天中也元始常於此天中演說靈寳大法此境乃覆下方東北變野鬼路之上也按說度人上品妙經時萬聖俱詣始青天中受元始度人無量上品也七聲大震十目齊觀睹下界之寃魔結衝天之穢氣衆眞默爾大道寂然七聲者謂凡間喜怒哀樂憂怨思七情之聲也無辜刑祝號呼籲天加以慘毒悲切上驚天聽諺曰人間私語天聞若雷斯乃謂大震也時在會者十目齊觀于下界四生歷劫交變身命運氣内外數窮焉禮記曰十目所視十手所指其嚴乎謂情切也故十方衆同心默而哀爾羣生矣仰惟大道元始至尊乃寂然不動感而遂通也按靈寳懺曰時元始上帝遂放神光下照乃見是六天魔鬼寃家等衆陣行凡間勾連世人亡過七祖死魂結成阿黨恣橫流行兇殺伐互相殘害晝夜不分血屍狼藉怨氣哀聲化爲黑毒衝天光時妙行眞人問所由於元始旣敷妙法合集殊祥是何異因於此輒冒可垂奥㫖以解衆疑時者乃妙行未知當時祥異所由也故發此問惟思分别元始乃萬天所尊無上法王位也旣敷演妙法常能開度一切和合殊祥也縁何却有此異因輒冒干元始御前妙行疑之至請紫微大帝可垂釋過去奥㫖以解今會中大衆之疑大帝曰下元生人皆禀至道受氤氲之清氣以扶衛於赤身一切有形凡軀皆屬下元三炁君主也各禀靈寳至道自然氤氲之氣流行降浹扶衛造化成男女赤身也按諸品經載靈寳始青之炁結元陽重三百八十四銖立命碧落空歌之炁貫經絡脉分應三百六十體骸大浮黎土之炁結化回黄轉白青赤構孕凝精元一黄演之炁結胞洞冥紫户之炁化胎長靈明仙之炁命魂碭尸冥演由之炁命魄五仙中靈之炁化臟高眞冲融之炁化腑高仙洞笈之炁化元眞靈化凝之炁結革自然玄照之炁結岳玉清混洞之炁化泥丸上清赤混之炁化絳宫太清玄通之炁化丹田熒惑三炁降眞火入心岀舌宰神炁温暖歲星九炁降眞木入肝出目宰皮膚毛髮鎭星一炁降眞土入脾胃岀口宰肌肉四肢太白七炁降眞金入肺出鼻宰牙齒筋骨辰星五炁降眞水入腎出耳宰津液血髓東方七宿炁主陽明經南方七宿炁主太陽經西方七宿炁主少陰經北方七宿炁主太陰經東斗蒼靈帝君主筭西斗白標帝君籍名北斗七政司其生聚南斗六司宰其動用中斗冲靈大帝縻落萬神莊子曰人者繼天順地序炁成形謂之物靈北斗經曰凡夫在世迷𧨩者多不知身屬北斗命由天府有灾有患不知解謝之門延福延生莫曉歸眞之路致使魂神被繫禍患來鍾靈應帝君降筆云當職禀玉帝大垂慈敕軫念蒼生合使天下黎民起自丁巳歲中元節後各互勸化醵財修設三界廣法明昌太平清醮一座者悉度末劫洪波蕩穢之界儀範恭請吾教徒侣法事宜宣太上延生之科誦經登壇拜表告地盟天靈應帝君督泰山府三司具名然後繳奏三天門下特與度脱劫運之名如此莫不眞爲樂也哉今以劫運將終妖魔漸盛按業報經云每劫之初龍漢赤明也洞眞下化人懷道德多至長生劫中之世上皇延康也洞玄下化人漸散朴失道叛德末劫之時開皇運終也洞神下化人多澆浮少奉正眞差天帝紏之世遭開皇三劫也宋中上元甲子後入開皇七劫嗚呼末劫之時凶灾彌天耶多見日月蝕昏五星錯度六極咎罰四夷交兵火焚水漂旱蝗澇蠁隕霜雹凍地陷山崩蛇虎怪異淫刑苛虐人妖鬼魔疫癘夭橫總名劫報西華帝君曰且夫天地劫運否泰終絶谷應大象所歸各隨萬化所息運終復建劫絶復始蓋大象無極無窮惟濁世衆生應劫受諸輪迴或遭運劫或遭氣劫或遭外劫或遭内劫或遭身劫或遭命劫若諸衆生本始業深所造亦昩遇諸劫界是若苦海流沙漂沉浩蕩終不得息劫至終時乃成永絶化爲幽怨之氣昨慶元丁巳歲上元節天垂降玉書下劍州梓潼神廟廟祝捧申屬繳文奏行在據英顯武烈靈佐廣濟惠寧王充金闕昊天檢校洞通眞先生九天開化主宰梓潼靈應帝君張亞准奉三天門下三宫使相關牒備丙戌歲三界靈享朝會以元儀正下元事籍畢各辭訖時昊天玉皇上帝駕御至上元太一宫出三天門觀覽下方六合八紘無不周徧惟見怨氣盤蔚寃聲哀號無辜籲天上徹宸聽玉帝大垂慈㫖謂侍臣金闕御史大夫三天門下平章事葛洪曰下方生靈上自權貴執政下至郡縣寀寮嚴刑峻法厚賦重斂以至强家巨室富商大賈一舉一措動以貨賂爲急所行所向惟務財利是營酒食聲色是御不顧道理口是心非行如狗彘父母師傅内外親族輕棄傲慢富不恤貧貴多忘賤婚娉先財貨交結趨世利强奪困窮刻剥寒苦富者不貸貧者多至絶滅玉帝命右常侍引詞章通事舍人王喬持節詔玉清宫太師守紫微垣天樞院事尹喜上清宫太師守紫微垣南極院事徐甲太清宫太師守紫微垣北極院事張道陵紫微上宫天皇大帝后土玄天皇地祇天地水三官大帝四帥聖帝君天府修文郎兖國公顔回地府修文郎河内公卜商水府修文郎清烈公屈原迦葉尊者阿難尊者賔頭盧尊者共一十八員旣至朝謁奏對御座玉帝垂音命羣臣曰下土生靈將臨末劫三教互忽爲僧道者多不顧戒行動輒非理爲搢紳士庶者不遵敬周孔之業爲官爵顯達者多生淫濫臟污及廣土生靈循習倒行輕賤百穀嗜財如飢虎行毒若炎火去正從邪習以成俗犯者不可原赦卿等衆臣自丁巳歲朔一月一會天庭稽考善惡仰靈應帝君同虚空界神先行降筆布告下方城隍社令仍牒東嶽泰山府永爲定制委舉意司見報司速報司曰加嚴察遞申天府如有不循不悛不加敬信之域量犯與報疾疫旱蝗雷電暴風卒雨隕霜雹凍傷殘百穀耗乏地財四夷交侵刀兵戰陣地陷山崩蛇虎縱横及遣魔鬼託生其家破傷基業覆滅親族如能改節勵行遵從太上感應篇言不犯諸罪目者别與轉禍爲福故兹降筆各宜知悉三天門下三宫使相牒九曲鳳凰山靈應帝君故牒施行唯從邪道失仁義禮德之所修者類不省本源忌父母師友之訓恩者類樂奉邪神樂淫祭亂神要副情懇者類諂求餘福諂諛禱怪力祈妄福者類昏迷沉亂昏酒與迷色恒失紀者類貪慾剛强貪非財棖慾氣剛强者類不義損彼利己者之類不仁暴物凌人者類不忠姦能不盡心者類不孝罔親害教者類是按靈寳混元救苦經元始天尊曰吾觀冥府罪魂乃是積劫以來至于今日在世爲人造罪種種不省本源貪饕疾妬暗損他人安樂自己爭財競氣好戀酒色損失神氣蕩散元眞不孝尊長不忠君主欺凌卑小舉意慢人造罪千種天官攝問斗君追魂送下九幽受其痛苦罪輕者化生六道罪重者永無出期縱復人身豈獲福禄哉今爲六天魔王五府瘟曹不以尊卑枉致傷害或老或少或女或男未盡天年徒違人世本非死限故使魂孤怨恨上衝盤結不散此之暴卒寔可悲哀按洞淵經云人間北方有酆都山水府大洞之旁列六宫號六天也六大鬼魔王所主乃太陰天君外六曹也六曹小吏合有三十六萬皆異狀殊形兇惡醜怪本暴逆之氣凝結爲體周流太虚也若人一念正眞持誦此六宫名號常生敬畏者乃感六天善開魔王保舉削除罪名生死受賴獲福無窮也若人一念邪慾乃召六天惡開隨人所犯輕重悉以六疰五瘟與報罰也第一天紂絶陰洞休明總陰洞陰宫專管酆都刑名寃獄生前罪戾令世人虚耗蕩散資財二天泰殺諒事洞元司重正司靈宫專收攝天下狂橫兇暴遊魂蕩魄今世人運命蹇滯功名官爵退失三天明晨耐犯武城洞統仙昇靈希宛宫專掠世人福禄賢聖凡人棄世魂魄先經此洞受事四天恬昭罪炁洞正眞邵靈宛司宫專掌瘟疫死喪灾火鬼怪銷磨世人田宅陰抽陽滅口舌官患五天宗靈七非洞雲樓玉紀明元宫主眷屬不睦夫婦乖違離背分張及鰥寡等事六天敢司連宛屢洞崇靈赤映雲曲宫專滅世人已出男女及懷胎孕主子母俱殁爲繼嗣事夫所謂五府者乃五嶽山府也各立瘟曹案按正一傳云五府瘟神禀五行不正之氣動出億萬周流人間嘘毒嘯禍東行號魔王西行名外道南遊稱鬼帥北征呼鬼王中國號瘟神也泰山府東嶽主者天齊仁聖帝所主管雜病事劉元達衡山府南嶽主者司天昭聖帝所主管瘟疫事張元伯華山府西嶽主者金天順聖帝所管瀉痢事趙公明恒山府北嶽主者安天元聖帝所主管暴汗寒瘧事史文業嵩山府中嶽主者中天崇聖帝行病司四案李公伸狂魅赤眼案鍾士季掌腫瘍案范仲卿掌酸痟案姚公伯顚狂五毒案各遣瘟卒遞歲四時變故春月隨百鳥喧鳴司録人禱詛夏月詐亡過家親假骨肉扇禍秋月附五部土公爲伏龍宅禁冬月隱五姓墳墓邀故氣攻食正一傳云諸部瘟曹收留社廟陰鬼甲馬常萬數徧行九州回喪車部死尸每伺隙人誤罹之故横流毒炁殺人老少男女壽不得盡其天年徒賴死違人世皆被三官右府籍之不得更生遂致魂蕩無依結聚孤憤衆多怨氣蔚翳不散元始同衆聖羣眞一睹斯惡豈不悲哀羣生命遭劫運乎北帝經曰劫末之時三天正炁漸消六洞故炁頓長致使人鬼不分邪正無别幽囚之炁於是而出自一而生從北而起以一生二慘怛之氣相仍二以至三邪魅之氣纏惑而復化四妖淫之氣浸湮妄流入人經絡攻心伐腎損肺枯肝脾胃黄雲不凝元陽黑白相背是以六天邪魔乗勢來侵八部瘟曹恣橫流毒唯修善之人形同劫界命不墮於凶亡矣太上說玄天大聖眞武本傳神呪妙經卷之五
