front:
  text: 太上說玄天大聖真武本傳神呪妙經卷之二
  hash: sha256:1dff37030f2ba81d8882e4f21b5a307655f46451732eab4120081a24d5b54965
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0150_HFL_002-001a, image: hfl/0530/0530-080.png}
body:
  text: 鄽人方田子佩升玄內教籙陳價集疏時有真人名曰妙行特離班次竦伏帝前曰臣宿有因緣得聞妙理北方大將玄武將軍巡察天人録善罰惡不知此將應化何因有何神通鬼神降伏是殿每朝會較結録籍不輟須臾具元儀畢許請問諸因緣事願惟大造少悟小聰十極之中真人位號皆有妙行之稱唯東極宫中者最作是班之領首莊子曰且有真人然後有真知引證彼真人之行虛皇尊曰與真常會無有明相敦為妙行時會中諸來者俱恪守班次惟東極妙行出笏越班伏奏竦求於紫微帝前而自頌宿契得聞玄武有妙理之因故發願唯問讚大造之副少悟小聰之懇為請耶夫道之字曰大也化之名曰造也仰之大而化之之謂聖此聖者果神智六通能擯攝鬼神事是時大帝隱几而言妙哉真人能為凡間然其玄武應化之因渺邈難窮希夷莫究隱几者乃伏几也時紫微大帝聞請則欣然伏御几案而俯示大衆興以讚羡妙行真人誠發妙哉之問玄武應化神通職業盛事耶故妙行善能為凡間啓塵俗之人普欲使將來知有天神玄武凡身修鍊了證六通總司三界功過等事且渺邈難窮者謂通化無緒無所不入莫可得而窮者也希夷莫究者謂神變難測無所不容莫可得而究者也按靈寶智慧上品證六通譜曰天眼神通視智高慧通目中朱童總五色之光洞觀無礙自上自下四方八面無所不照無所不明地耳神通聽智遠慧虛廓中元窗總五聲之音聲感響應上聞九天下聽九地無所不知無所不究東鼻神通空智清慧寥孔神黃寧總五氣之氛洞妙自然出入陰陽往來無門西口神通虛智微慧郎竅官太和總五味之清洞達神英虛無不納頤無不容南心神通清智明慧開舌司正倫總五神之柄洞杳飛芒經緯萬方不疾而速不行而至北手神通微智遐慧深主司人關法四時玄序洞妙九微把握生端上應天關陰察禍福是故玄帝由持此之大戒處凡而能攝伏眼耳鼻口心手之塵欲乃得經濟而神性兼通於六洞也然後威加鬼神應諸外道不祥莫不聞風而伏玄帝歟蓋乃玄元聖祖護度天人應化之身神明之妙玄帝聖祖乃祖氣也三寶之尊神是歟天寶君主聖祖始氣出書時號高上大有玉清宫靈寶君主元氣出書度人時號上清玄都玉京七寶紫微宫神寶君主玄氣出書時號三皇洞神太清太極宫並出大有金書天寶以開天地之光靈寶以開九幽長夜之魂神寶以制萬靈之事故知太上護度應化之恩每隨人天諸根性漸令入諸圓成也存神者助神通以化之見明者教明察令變之中斗經曰大道無形常居杳冥聖中之聖靈中之靈包羅無外含養衆生蓋無形之為道非有象之可言變化億千虛無難測蓋元氣也非弗是也元始元氣生天生地清淨經曰大道無形生育天地應運經曰太虛無象朴散為人天布日月星辰之象地結山川海嶽之形人禀五行陰陽之秀皆本祖氣相承弗是有象可言耶荀子曰天不言而人推高焉地不言而人推厚焉天地為大矣人不誠則不能化萬物是故元始行不言之教而强名曰道較之變化億千者數也且萬得十千兆則百千億計千千矣千千名大千世界機分百萬於虛無中推運是理也彌綸萬天統御萬界以分萬象以明萬物以傳萬法制御萬靈攝召萬氣以通萬化擯斥萬魔不著萬有云云莫測且玄元聖祖八十一次顯為老君大洞天寶君內號曰玄元聖之祖也乃生一成二以開大羅三境之天出號曰元始也洞玄靈寶君內號曰玉晨虛皇尊法三三不夜之光開九霄之天境出號曰大道君也洞神神寶君內號曰玄元後聖君法九九八十一氣布列八十一陽天方顯號曰老君也混元經曰老君顔若嬰兒生成鬚髮皓白上天內號曰老子叙教品經曰元始故命老子託化人間或夷或夏隨世改號演說科誡開度一切有為羣品也按道藏總龜載當太古上三皇時號萬天玄師出玄中大法於世中三皇時號曰有古先生出太素經於世下三皇時號曰金闕真人出金闕祕經於世教民以太平無為之道也上古伏義氏時號曰鬱華子當出元陽經於世教順性命之道神農氏時號曰大成子出太一元精經於世教以好生之道軒轅氏時號廣成子出道誡經教以飛騰之學游淨樂國時號紫元君授玄帝太和玉虛之訣教以智慧上品大戒乃歸根之道中古少昊時世號曰鴻濛子顓頊時世號曰赤精子帝舜時世號曰録圖子帝堯時世號曰尹壽子帝舜時世號曰務成子夏禹時世號曰真成子商湯時世號曰錫則子周文王時世號老聃官佐柱下史出道德二經於世時關令尹喜受學今補為大羅玉清聖境太師之官判天樞院事莊子曰關尹老聃古之博大真人也寂寞無形變化無常仙翁葛洪曰老子是天地之精神無世不出八十二次變為玄武玄武名成於後天之際按降筆實録玄武果先天始氣五靈玄老之化乃元始化身太極别體上三皇時下降為太始真人孔穎達疏老子道生一此太極是也太極生兩儀中三皇時下降為太初真人日月在太易時含光太初時發輝下三皇時下降為太素真人按白虎通載形兆既成名曰太素此燧皇立人夫婦之道化當黃帝時生淨樂國為王子時道號潜雲子於道有功玉帝奬勳始封玄帝之號也夫大道者元始帝先賜封五靈玄老開北召水乃元黃植象之根次漸分氣化形一一為上帝之官也謹顯諸化太始天一二身太初太陰辰星月孛斗牛女虛危室壁二十九身六甲壬癸一十八身太素北獄亥子丑乾坎七身風雷雨電霹靂一十五身羌老八煞人星一十身至玄帝身乃第八十二次化也故知玄武者老君變化之身武曲顯靈之驗老君别號曰混元上帝易有太極是也太極分化太始經曰老君變化之身也大帝人以其從弟武曲顯靈事驗處為比者蓋兩聖功德頗類按北斗本生經曰昔龍漢初劫有周上御國紫光夫人於上春日游玩至溫玉池邊方脫衣澡盥忽感蓮蘂九苞一開發中有化生九子夫人護抱鞠養宫中志願惟成聖哲佐輔乾坤諸子洎壯冠乃各修因地功行俱滿白晝冲天並受得三清貴職矣天皇大帝長子也佐紫微上宫紀綱元化衆星主領紫微大帝第二子佐北極中宫明堂布政下土貪狼配天為元主萬物為延生巨門配地為元主物命為延命祿存配日為火元主祿為保命文曲配月為水元主祿為益算廉貞配其土為江元主官爵為消灾武曲配水為河元主壽為散禍破軍配金為海元主妻兒為扶衰按傳洞真注北斗經第六武曲輔星玉諱曰上元處凡修鍊時奉行北極天心大法救物利生道號曰太車子德稱曰定真君不日行滿功圓承天詔飛升官拜紫微垣太常執事斗中玉册位房斗中紀明真皇天闓陽宫所配事水政主録河元主管神仙升進公事上總九天上真中統五嶽飛仙下記學道之身歷諸功勤合轉階級者悉總調達注名玉曆管攝下土歲時發生地財度支天倉府庫出納事且玄武寄凡自開皇初劫雖異世所修並充天職臨事同體悉以蒼生為心其舍靈受所賜者多矣於是二真紫微徽贊顯靈而同驗耶本虛危之二宿交水火之兩精天中北上乃化玄氣之宫有虛危二宿位分占天次二十六度二十五分半是日月兩曜緯躔之舍副日帝月皇之政水火在昔炎帝癸巳歲正月朔戊午日旦甲寅時日月合璧二氣混虛危宿度神彩流降奎婁之域淨樂國境也善勝皇后偶寢宫酣熟靈游軀外見像日圓光入口吞之而覺有孕是歲末炎帝國滅于版泉黃帝受命都建有熊甲午歲立焉淨樂君誕生聖子乃虛危分秀水火流晶而成形體壯年受學玄元化度法要義㫖曰太和玉虛紫微上都五常回曲六律引書清朗為氣玄秀應敷帝有妙法君降極圖象遍梵境通運神居廣方便門衆妙無殊無真不現無道不俱順于變化逆于邪途乾為十合坤連萬墟入淨出渾應變總如此境至極上號曰太玄都實録云紫元君復授道要畢囑曰子當龍漢四劫披髮跣足攝坎離真精歸根復位返本於虛危之間也或掛甲而衣袍或穿靴而跣足常披紺髮每仗神鋒董真君曰玄帝准告命往下方降魔日元始有敕神如斯結束莊子曰天與之形道與之貌是耶聲震九天既拜九天遊奕使又領九天採訪使司察功過神仙公事於是九霄梵天之上玄帝威聲豈不震歟威分四部專三界大督之柄按月遍紏四大部洲鬼神公事東自播本佛于岱部西至流沙瞿耶尼部南至交址閻浮提部北極幽陵鬱單越部應城隍鎮戍械甲兵馬等神並聽節制況玄帝令名威權豈得四部之神祇不職歟擁之者皂纛玄霧躡之者蒼龜巨蛇玉清宣賜皂纛時當永壽元年上元節也樹旗事若玄霧興生乃表威權之望於是乎十億烈士咸睹旌旄皆同會信悉赴太玄之命又地軸水精神龜天關火精聖蛇捧擁玄帝足下司行討伐天上天下一應不正妖氣最威者是天關地軸皂纛也神兵神將從之者皆五十萬玉童玉女侍之者各二十四行行也者列次也此職右勝府之近司屬隸北靈官為次也則左右分掌威儀及書記三界中善惡功過等事按仙傳拾遺記曰漢相張良避世登真位號太玄童子按啓聖記云信州弋陽縣有敕封額寂照孝女之祠原本右勝府中掌籍緑霞瓊女也因陸中道同妻張氏素勤恪真武香火惟求嗣續至晚年妻夜夢吞紅纓感孕誕一啞女顔色絶倫至十三歲一日忽琅然發聲告别父母曰兒本是上天雙女宫緑霞瓊女兒昨因父母求嗣於北方真武蒙參照父母枝慶案籍即無胎産男女之名真武遂以父母有處世平等之誠保奏三天蒙回降敕㫖下點差兒化紅纓投胎充女身注一紀壽終歸上會兒離天府時承真武慈㫖汝到人間切勿發聲今聞宋朝司天監言陳國分野當弋陽縣下有陰貴仙骨異人現定來刷兒身恐泄天機未便況兒壽限過期當歸聽北極右勝府副判司秪備差使一任七年滿日得返雙女宫矣言訖奄逝事達聖聽敕贈今號也以此表證是府玉童玉女定制額也綬北帝之靈符漢官儀曰綬者有所承受也所以别尊卑彰有德也玄帝於飛升時受金闕賜北帝靈符之册牌首見竅穿以銷金飛雲紫白文帶謂之綬也牌面符書乃金篆文曰太玄元帥龍文攝化之符佩乾元之寶印佩也者身服玉佩也白虎通載故能修道無窮即佩環玄帝飛升時金闕賜佩絞鈕玉印以封事為信驗者也印章命曰乾元寶印符印上式權且以凡間書模也想天文敷焕凝結成篆況玄帝增封拜加重職六事奉權命符印又六顆矣規成模範大小及文篆則凡世所未得見聞流傳也驅之有雷公電母御之有風伯雨師北極右勝府事天蓬大元帥判五雷院事職階曰都天大雷公也所轄風雲電雨之使及飛龍騎吏左右億千兵馬水府力士河伯吏兵共三十萬衆日夜周緯陶鑄都天之下萬彙諸品物耶右勝府事討罰鬼魔不正事則是等准副共合大信遵依揮纛行營之命驅馳駕御威奮赫奕助罰不正公事按上清法隱書所録諸大聖者官叙階職品男官女官姓諱謹顯之于后五雷院屬第一廳男官雷霆院事霹靂大總管通天入地變現搜捉大將軍吳天安第二廳男官興駕霹靂九天遊奕討罰姦邪使欻火搜捉大將軍鄧伯溫雷公五員第三廳男官雷霆號令星火炎飛懲警下過心事監魂縛魄大將軍王明第四廳女官雷霆院斬祟擒龍大將軍王天安第五廳女官雷霆院破廟斬尸大將軍吳天明電母都使北極驅邪女官右總管雷霆四時電光事大仙母尋姦大將軍田守明同知院事男官雷霆院催電發震欻霹靂火通天入地搜姦急捉大將軍田守真風伯大君北極右勝院風伯副箕使紀綱八卦行風使案糾不法怪異風變事大將軍金三五雷院都大簽書諸部雷霆録籍歲行風雨電射應干不正邪魔事判官辛漢臣雨師神龍九天開化掌籍主宰充下元水府轉運使檢校諸洞行雨公事元皇靈應帝君張亞統五湖四海九江八河七澤十二溪谷行雨龍君外行雨洞龍右一百七十號見孔雀經夫五雷六甲八煞皆五靈玄老氣化分靈孕凡荐修今號方出也淮南子曰雷電不興風雨不作是故五雷號令電火徵姦風布八卦雨澤行教乃降至和生成萬物不然雷轟霹靂電火爍焚風烈怒號雨驟霰雹斯非韶雅之象天行誅討耶詩云敬天之怒無敢戲豫衛前後則八煞將軍隨左右則六甲神將乃玄都右勝府正衛威北八煞大將軍八營駐劄于酆都獄華蓋山之前也謹顯諸煞姓名之次第天煞將軍張子庶地煞將軍陳子青日煞將軍李子德月煞將軍范子章水煞將軍社子貞火煞將軍劉子大金煞將軍王子言石煞將軍賈子元副翼衛司威南六甲大神將六寨營伍旁列于太微垣華蓋星之下也又謹顯諸將姓諱甲子水將李文思甲戌土將李守通甲申金將李守全甲午火將李守左甲辰風將李守進甲寅木將李守遷按說靈寶經時元始在始青天中演教度人偶下土東北凶變則神公受命普掃不祥也斯時六甲抱金關七政守靈壇八威奔電激九鳳破凶邪並准副玄帝討罰前後剛澤左右微控也可謂金鉞前戮巨天後刑非特此時至今號令亦爾開皇章曰羣魔欽至化萬國保康寧是謂也天罡太一率於驅使之前率也者賔伏也於也者幸侍也天罡太一亦係五德神君乃賔伏幸侍充太玄從官常備准威用按本經載云擁之者皂纛玄霧躡之者蒼龜巨蛇也乃右天罡掌皂纛諱監兵乃白虎七煞右將軍及下太一載聖足諱執明本玄武五煞後將軍蓋聞玄天上帝威貫神真也授職階北極左天罡之罡皂纛旗心端設北辰貴其生成萬彙也又階職鎮天玄武三界大都督之宫每恭行天討罰凶則神武不殺也其右天罡下太一顓行司殺事也按玉册曰降水火二精於掌握則三五合同功也三乃聖蛇五乃神龜也攝甲庚兩將於紀綱得七九齊制用也七馴蒼虬九御玄駿故知驅策斬變惟此數將最能關固社令城隍悉處指揮之下悉也者皆聽也處也者制度也社令城隍係在所國土州府軍縣鎮監鄉村疃里各有斯職分領陰景卒吏機察本界中事皆聽太玄指揮制度使令也昔者巢城犯惡當玄帝蕩沒彼處無得城隍社令遵副自化道士證明焦婆充彼處土地聽指揮也啓聖記云昔巢州四民凶暴乃積劫纍聚殺害物命恣充口腹脂肥以至僧道之流亦皆倣效俗態逐日血尸狼藉穢氣上衝觸犯日月星辰亦滅光色是時九天察訪使上奏天廷昊天玉皇駕御出三天門觀覽間果見吳分巢州地惡人凶乃命天官紫微大帝及地水二宫取嶽司委實北極方詔右勝府副帥下蕩此境連城陷沒為洲永清淨也真武趨朝得㫖嘆奏臣聞地方千里未必人人在劫切恐大寃愈結容臣下審地祇大帝復曰此州城隍社令悉預奉玉帝敕㫖遷任他所真武遂遵副敕命仍遣部下右天罡先行審察既降遂變一大鱉死浮溪面果官吏士庶互報鬨來分臠無不食者真武亦睹斯惡自化為凡流道士巡門遍經覓水驗實唯焦婆家有不殺之德餉水清淨真武謂焦婆曰此城不久當蕩為湖也可速登聖女山居作湖山土地道士言訖不見婆挈家同子婦竟登是山既至回觀睹黑風巨雨霹靂洪波於頃刻間不見城基泒為水界婆手加額忽瞻見空際一神狀貌若覓水道士降言此水屬汝所管也道士既升鄰州官吏乘楫到山詢婆元因各申所屬婆眷忽相繼損世西晋封靈顯聖母改湖山從焦姓號豈不因真武處分指揮保斯職乎有妖皆剪無善不扶精乃物妖之感化有犯則無不剪除也善人方便益世暗中真司扶助纂啓聖記如魏公韓琦判大名府時熙寧二年已酉歲秋據黃河噪吏馳報曰本噪嘗有一巨龜之精出害生靈久矣今又出浮於水面怒濤汹發壩𡍋崩隳水勢暴橫莫知漂溺人命公聞急遣幕使鄭圭通判華惇措置奉㫖至隄一人朝服焚香仰扣北極真武曰願降靈助鄭圭剪妖遂張弓矢射中龜沉水順塹整𣟘完忽一夕圭奄若夢間被二吏拘曰吾承閻羅府追汝證對殺龜公事執行至一山府二吏自相語曰真武今日降此圭聞問故曰校勘中下二界黎庶應造善惡並屬此風吥羅山府所理也圭越從入急趨雪故蒙㫖下案檢會水族格曆俄齎簿呈龜前身本人生西京大宛為齊明俠子名程宣也治雲夢城不法唐高宗遣大將陳元忠討西其城下日火燒身死魄充此地城隍擅自邀祭枉害人命酆都紏知罰為黃河四燥卓州界內推潮運沙土地之職却於咸亨三年庚午歲魄氣投龜胎既生長輒徙黃河七𣟘大宋北京界內興發水灾已四百年共枉殺黎民生命萬數真武聖判曰龜死本當碎尸尚敢妄詞寃執陽間屬官理索性命況鄭圭遵魏公㫖韓琦不日除赴紫府真人之位當吾保奏也圭拜謝間聖遣符使懷神龜與承吏鄭圭同赴韋閻羅庭申禀事因妖龜尚言希求生路身乃五百歲成器之形王敕符使出其神龜金光罩挾妖龜騰空碎為微塵飄揚撒盡地司令鄭圭還生從此人間永無斯禍朝金闕而赴崑崙開天門而閉地户杳冥恍惚審察窮通金闕者乃大羅三天上帝宸庭總號也曰金闕玉清金闕上清金闕太清也崑崙者謂無上之基玄都玉京山名也乃清微禹餘大赤三天宫殿建在斯山內也昔日詔玄帝趨赴朝見元始是時奉命行事功著人鬼分途司主開陽閉陰故謂開天門閉地户也分期出杳入宴恍惚經緯萬方往來審察三界窮變通化隨宜開度一切有為無為事理右按降筆實録每羣真朝會昊天玉皇上帝則四聖為都班之首引領起居也居其壬癸之方居者安處也太極始判分二儀開天一生水闔地二孕火立為壬癸之方列紫微北面易納甲義壬癸者乃乾坤之至精也乾陽動生甲壬成坤陰靜生乙癸就乃化天地陰陽之和氣也乾中靜變壬為離日坤中動化癸為坎月迭往迭來盈吳戊己而負陰抱陽司化萬物實緊水火陶魂鑄魄也按降筆實録云玄帝所居之闕號曰天一真慶宫處紫微北上在太素秀樂太虛無上兩天之間宫殿巍峨皆自然妙氣所結琳琅玉樹靈風自鳴聲合宫商之韻紅光紫霧常覆其上此處則玉虛無色界也助有甲庚之將或乘玄駿或跨蒼虬助有者順立成局務也甲庚將者將乃帥之佐有正副四員甲戌庚辰也甲仁愛庚義宜關制令命戌信誠辰吹噓魁罡爰從喻若造父王良左右攝提之職掌玄帝馬院龍廄之政也甲戌將正副者除牧玄駿之使乃引轡執策之承易納甲義甲乃乾之應戌乃乾之比一將名位處室壁之間應天象如造父王良政焉庚辰將正副者豢馴蒼虬之紀佐襲逐飛御之官易納甲義庚乃震之應辰乃震之比二將名位處角亢之下應天象若左右攝提任焉乘者駕也玄駿者玄乃驪黑色駿乃形之高八尺也曰元馬本奎比河中天駟分精易說卦乾健也乾為馬而應陰紀陽故能往復踴健也跨者騎也蒼乃青碧色虬是獨角龍也曰標携龍角帝座之别區也易說卦曰震乃動也震為龍時潜升陰中之陽常風雨奉之目閃電光眉橫雲陳身長千丈頂戴三台按降筆實録云玄帝為凡人時身長九尺面如滿月龍眉鳳目紺髮美髯顔如冰清頭頂九氣玉冠身披松蘿之服自飛升後每奉降魔制妖神變千丈大身雲眉電曰三台六星為冠上台司命主壽上星應天子下星應女主中臺司中主宗室上星應諸侯公王下星應卿大夫下臺司祿主兵上星應士子下星應庶人太微三台六星兩兩相比傾光隨覆玄帝之頂世人倣效為冠名晋天文志三台為天階太一和陰陽理綱紀主開德宣符之驗右按法家符祝曰上台一黃祛却不祥中台二白護身鎮宅下台三青治病除瘟故知三台垂象神光焕赫而能昭德塞違者也其動也山水蒙其靜也地天泰以兹顯化故乃神通按太玄都真藏玉華筌云祖氣化易啓肇應運混元隱顯變易交參夫蒙泰動靜玄義乃金液化神煉以成剛日用之法也昔太華老人云修外者無極無窮修內者無形無影外修太虛內修氣運故得外神安而內氣合乃名顚倒返神之數也動蒙艮山為鼻息出入坎氣血通流利用育德而成聖功太素秀樂天君曰以無為上下左右前後以氣神和之故能常得自然之妙謂寄身行道託命傳真也靜泰坤地母為黃一乾天父乃祖始有無交相陰中發陽西華帝君曰若能寢處引息其神知其所出可見本神不為幻影所著不為夢寐所奪此為運坤神而變乾象也按金碧潜通龍虎上經曰六十卦體盡出乾坤中還須經否泰始可議屯蒙按張平叔續易道曰故易道妙盡造化之體用遂達託象審於斯文蓋一在其中矣乾上坤下天地否乾坤為鼎器坤上乾下地天泰交感如日月水雷屯守一存三兔雞月停火山水蒙聖功神化運混沌育元精蓋人倫禀協無出一氣之元若夫善頤元鼎善運一氣是不足度于五行可成真道復命篇曰東南西北要精通交感乾坤雌與雄火候直須牢穩審吹噓全藉巽家風陰符經曰天發殺機龍蛇起陸謂後弦之前東南巽位地户也坤寄體地户坤母索一二生屯就二而索三成蒙難易同氣相求剛化先柔使神有所度而氣有所流動法運天根發巽時以據內動蒙屯生成之數加四奇八耦象日月之右轉三百六旬度之載己土而養金鉛專以鼻嗅始青真氣入于泥丸金生真水燧爐火候結練陰符經曰人發殺機天地返覆謂前弦之後西北乾位天門也乾本位天門坤無定位月節臨乾蓋乾坤三變而興否泰居寅申也寅生離火成己土申生坎水伏戊火也靜法守地根在乾時而當外存乾坤二策之數否泰日往來如天道之左旋三百六旬一周戊火以襲木汞次以舌下華津飲三十六咽使火化真土變神以御玄靈正陽真人訣曰身中用年月日中用時刻謂以日為年以辰為節也但任外神遷變而以內氣固養外當隨化應時內得神堅氣固以此修之最為捷法也下士遇化而歸真真士開度以上升玉虛太清章曰玉虛之始化于太清變運上極持正入真化氣攝穢匡御衆靈鍊寶回光五常集嬰律令統紀度拔衆生神降氣平保練常寧以入真界諸魔潜傾此道名上境學者謹諦聽日月至年運修進無回停大功三萬日小功百日升應有緣法士用之以虔誠速度諸業海超登上玉京故知玄帝修四十二年成兹上道得證諸神通矣太上說玄天大聖真武本傳神呪妙經卷之二
